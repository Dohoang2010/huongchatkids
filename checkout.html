<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ADMIN:SEO (trang quản trị ghi đè khối này) -->
  <title>Thanh toán – Hương Chất Kids</title>
  <meta name="description" content="Thanh toán nhanh không cần tài khoản – Hương Chất Kids.">
  <!-- /ADMIN:SEO -->
  <meta name="theme-color" content="#F0537A">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261005g">
  <link rel="icon" type="image/png" sizes="96x96" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/logo-192.png">
</head>
<body>
<main id="app"><div class="container">
  <nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><a href="cart.html">Giỏ hàng</a><span>›</span><span>Thanh toán</span></nav>
  <div id="checkoutPage"></div>
</div></main>
<script src="js/data.js?v=20261005g"></script>
<script src="js/diachi.js?v=20261005g"></script>
<script src="js/qrcode.min.js"></script>
<script src="js/app.js?v=20261005g"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { $, $$, fmt, I, productThumb, shortName, Cart, Customer, esc, shipFee, applyCoupon, store, toast, phoneOk, submitOrder, deliveryEstimate, orderSuccessHTML, hoursNote,
          addrParse, addrStore, addrFull, phoneKey, Session, tierOf, tierBadge, loyaltyApi, openOtp, refreshProfile, giftFor, giftBox, ketHop, byId, isForMom, rankDefault, shipText, ghnInfo, hangCho, traHang, openLogin } = MC;
  let lines = Cart.lines();
  if (!lines.length) { $('#checkoutPage').innerHTML = `<div class="empty card"><div class="emoji">🧺</div><h3>Chưa có sản phẩm để thanh toán</h3><p>Mẹ chọn sản phẩm trước nhé!</p><a class="btn btn--primary btn--lg mt-16" href="collections.html">Xem sản phẩm</a></div>`; return; }
  const c = Customer.get() || {}; let coupon = store.get('mc_coupon', ''); let shipMethod = 'standard';
  let sub = Cart.subtotal(); let multi = Cart.multiDiscount();
  const { maTotNhat, chipMaDaLuu } = MC; if (!coupon) coupon = maTotNhat(sub - multi, lines);   // tự áp mã khách đã lưu ở trang chủ
  const DIA = window.DIA_CHI || [];
  let qua = giftFor(lines); let quaVi = (qua && qua.vi && qua.vi[0]) || '';
  const itemsHTML = () => `${lines.map((l) => `<div class="it"><img src="${productThumb(l.p)}" alt=""><div><div class="n">${esc(shortName(l.p))}</div><div class="q">${l.variantLabel ? esc(l.variantLabel) + ' · ' : ''}x${l.qty}</div></div><b>${fmt(l.total)}</b></div>`).join('')}${qua && qua.soQua ? `<div class="it it--gift"><span class="it__gift">🎁</span><div><div class="n">${esc(qua.moTa)}</div><div class="q" id="giftViNote">${esc(quaVi)}</div></div><b class="text-teal">Tặng</b></div>` : ''}`;

  /* ---- Ưu đãi hạng khách hàng: chỉ tính khi số điện thoại đang nhập đã xác thực OTP ---- */
  const loy = SITE.loyalty || {};
  const phoneNow = () => phoneKey((form && form.elements.phone.value) || c.phone || '');
  const tierPct = () => (loy.enabled ? Session.discountFor(phoneNow()) : 0);

  const calc = () => {
    const base = sub - multi;
    const r = coupon ? applyCoupon(coupon, base, lines) : null;
    const couponAmt = r && r.ok ? r.discount : 0;
    const pct = tierPct(); const hang = hangCho(phoneNow()) || tierOf(0);
    const hangAmt = pct ? Math.round(base * pct / 100) : 0;
    let dungHang = hangAmt > 0, dungMa = couponAmt > 0;
    if (!ketHop().hangMa && hangAmt > 0 && couponAmt > 0) { if (hangAmt >= couponAmt) dungMa = false; else dungHang = false; }
    const discount = (dungHang ? hangAmt : 0) + (dungMa ? couponAmt : 0);
    /* Phí GHN theo tỉnh đang chọn; chưa chọn tỉnh → null (hiện "từ … · theo địa chỉ") */
    const city = form.elements.city.value;
    let ship = r && r.ok && r.freeship && shipMethod !== 'express' ? 0 : shipFee(base - discount, shipMethod, { tinh: city || '?', lines });
    if (!city && ship && shipMethod !== 'express') ship = null;
    return { r, couponAmt, hangAmt, hang, pct, dungHang, dungMa, discount, ship, city, total: Math.max(0, base - discount) + (ship || 0) };
  };
  const canExpress = (cityName) => (SITE.expressCities || []).some((x) => (cityName || '').includes(x));
  const dc = addrParse(c.address || '');
  const tinhOptions = (sel) => `<option value="">Chọn tỉnh/thành</option>${DIA.map((p) => `<option ${p.t === sel ? 'selected' : ''}>${esc(p.t)}</option>`).join('')}`;
  const xaOptions = (tinh, sel) => { const p = DIA.find((x) => x.t === tinh); if (!p) return '<option value="">Chọn tỉnh/thành trước</option>'; return `<option value="">Chọn xã/phường</option>${p.x.map((x) => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('')}`; };

  $('#checkoutPage').innerHTML = `
    <h1 class="page-title">Thanh toán</h1><p class="text-muted fs-14 mb-16">Không cần tạo tài khoản · Chỉ mất 30 giây</p>
    <form class="checkout" id="coForm" novalidate>
      <div class="flex flex-col gap-16">
        <div id="loyaltyBar"></div>
        ${c.phone ? `<div class="qb__saved">👋 Chào ${esc(c.name || 'mẹ')}, thông tin giao hàng đã được điền sẵn từ lần mua trước <button type="button" id="clearInfo">Nhập lại</button></div>` : ''}
        <div class="card card--pad"><h3><span class="num">1</span>Thông tin nhận hàng</h3>
          <div class="form-grid form-grid--2"><div class="field"><label>Họ tên <span>*</span></label><input class="input" name="name" placeholder="VD: Nguyễn Thu Hà" value="${esc(c.name || '')}" required autocomplete="name"></div><div class="field"><label>Số điện thoại <span>*</span></label><input class="input" name="phone" type="tel" inputmode="numeric" placeholder="VD: 0912 345 678" value="${esc(c.phone || '')}" required autocomplete="tel"></div></div>
          <div class="form-grid form-grid--2 mt-12"><div class="field"><label>Tỉnh / Thành phố <span>*</span></label><select class="input" name="city" required>${tinhOptions(dc.tinh)}</select></div><div class="field"><label>Xã / Phường <span>*</span></label><select class="input" name="ward" required>${xaOptions(dc.tinh, dc.xa)}</select></div></div>
          <div class="field mt-12"><label>Địa chỉ cụ thể <span>*</span></label><input class="input" name="address" placeholder="Số nhà, tên đường, thôn/xóm…" value="${esc(dc.chiTiet)}" required autocomplete="street-address"></div>
          <div class="field mt-12"><label>Email nhận xác nhận đơn hàng</label><input class="input" name="email" type="email" placeholder="VD: mehanoi@gmail.com (không bắt buộc)" value="${esc(c.email || '')}" autocomplete="email"><small class="field__hint">📧 Shop gửi email xác nhận đơn kèm mã đơn, danh sách sản phẩm, quà tặng và hoá đơn VAT vào địa chỉ này.</small></div>
          <div class="field mt-12"><label>Ghi chú cho shipper / chuyên gia dinh dưỡng</label><textarea class="input" name="note" placeholder="VD: Giao giờ hành chính, gọi trước khi giao, bé 2 tuổi 12kg cần tư vấn liều…"></textarea></div>
          <p class="qb__privacy" style="text-align:left">Thông tin chỉ dùng để giao hàng và tư vấn, không chia sẻ cho bên thứ ba. <a href="policy.html?p=bao-mat" target="_blank">Chính sách bảo mật</a></p>
        </div>
        <div id="giftWrap">${giftBox(qua, true, quaVi)}</div>
        <div class="card card--pad"><h3><span class="num">2</span>Vận chuyển</h3><div class="form-grid">
          <label class="ship-option"><input type="radio" name="ship" value="standard" checked><div><b>Giao tiêu chuẩn</b><small>Nội thành Hà Nội trong ngày · Tỉnh khác 1–3 ngày</small></div><span class="fee" id="stdFee"></span></label>
          <label class="ship-option" id="expressOpt"><input type="radio" name="ship" value="express"><div><b>Giao hoả tốc 2–4h</b><small>Chỉ nội thành Hà Nội, đặt trước 16h</small></div><span class="fee">${fmt(SITE.expressFee || 35000)}</span></label>
        </div></div>
        <div class="card card--pad"><h3><span class="num">3</span>Thanh toán</h3><div class="pay-options">
          <label class="pay-option pay-option--card"><input type="radio" name="payment" value="cod" ${(c.payment || 'cod') !== 'bank' ? 'checked' : ''}><span class="ico">💵</span><div><b>Thanh toán khi nhận hàng (COD)</b><small>Kiểm tra hàng rồi mới trả tiền cho shipper</small></div><span class="badge badge--teal tagr">Phổ biến</span></label>
          <label class="pay-option pay-option--card"><input type="radio" name="payment" value="bank" ${c.payment === 'bank' ? 'checked' : ''}><span class="ico">🏦</span><div><b>Chuyển khoản ngân hàng / VietQR</b><small>${SITE.bank ? `${SITE.bank.name} · ${SITE.bank.account} · mã QR đúng số tiền hiện ngay sau khi đặt` : 'Mã QR hiện sau khi đặt hàng'}</small></div><span class="badge badge--soft tagr">Giao ngay khi nhận tiền</span></label>
        </div></div>
        <div class="card card--pad upsell hide" id="upsell"></div>
      </div>
      <div class="checkout__side"><div class="card card--pad">
        <h3>Đơn hàng (<span id="orderCount">${Cart.count()}</span> sản phẩm) <a class="fs-13 text-primary" style="margin-left:auto;font-weight:500" href="cart.html">Sửa</a></h3>
        <div class="order-items" id="orderItems">${itemsHTML()}</div>
        <div class="divider"></div>
        <div class="coupon"><input class="input" id="couponInput" placeholder="Nhập mã giảm giá (nếu có)" aria-label="Mã giảm giá" value="${esc(coupon)}"><button class="btn btn--dark" type="button" id="applyCoupon">Áp dụng</button></div><div id="maLuu"></div>
        <div class="coupon-hint" id="couponHint"></div>
        <div class="divider"></div>
        <div id="summary"></div>
        <button class="btn btn--primary btn--lg btn--block btn--stack mt-16" type="submit" id="coSubmit"><span>${I.zap} ĐẶT HÀNG · <span id="coTotal"></span></span><small>Kiểm tra hàng trước khi thanh toán · Giao dự kiến ${deliveryEstimate()}</small></button>
        <div class="qb__trust"><span>${I.check}Chính hãng 100%</span><span>${I.check}Đổi trả 7 ngày</span><span>${I.check}Bảo mật thông tin</span></div>
        <div class="form-error hide mt-8" id="coError" style="text-align:center" role="alert"></div>
        <div class="divider"></div>
        <p class="fs-13 text-muted" style="text-align:center">Gặp khó khăn khi đặt hàng? <button class="fw-700 text-primary" type="button" data-callback>Để chuyên gia dinh dưỡng gọi lại</button> hoặc <a class="fw-700" style="color:var(--zalo)" href="${SITE.zalo}" target="_blank">đặt qua Zalo</a></p>
      </div></div>
    </form>
    <div class="sticky-order" id="stickyOrder"><div class="tot">Tổng cộng<b id="stickyTotal"></b></div><button class="btn btn--primary" type="button" id="stickySubmit">${I.zap}Đặt hàng</button></div>`;

  const form = $('#coForm');

  /* Quà phụ thuộc hạng khách: tra được hạng xong là tính lại */
  const renderQua = () => {
    const truoc = qua && qua.soQua;
    qua = giftFor(lines, { coMa: calc().dungMa });
    if (qua && qua.vi && !qua.vi.includes(quaVi)) quaVi = qua.vi[0] || '';
    const w = $('#giftWrap'); if (w) w.innerHTML = giftBox(qua, true, quaVi);
    if (!!truoc !== !!(qua && qua.soQua)) { const it = $('#orderItems'); if (it) it.innerHTML = itemsHTML(); }
  };
  const renderSummary = () => {
    const ml = $("#maLuu"); if (ml) ml.innerHTML = chipMaDaLuu(sub - multi, lines, coupon);
    renderQua();
    const k = calc();
    $('#summary').innerHTML = `<div class="summary-line"><span>Tạm tính</span><span>${fmt(sub)}</span></div>`
      + (multi ? `<div class="summary-line"><span>Mua từ 2 giảm 3%</span><span class="text-teal">−${fmt(multi)}</span></div>` : '')
      + (k.dungHang ? `<div class="summary-line"><span>Ưu đãi hạng ${esc(k.hang.label)} (−${k.pct}%)</span><span class="text-teal">−${fmt(k.hangAmt)}</span></div>` : '')
      + (k.dungMa ? `<div class="summary-line"><span>Giảm giá (${k.r.code})</span><span class="text-teal">−${fmt(k.couponAmt)}</span></div>` : '')
      + (qua && qua.soQua ? `<div class="summary-line"><span>Quà tặng</span><span class="text-teal">${esc(qua.moTa)}</span></div>` : '')
      + `<div class="summary-line"><span>Phí vận chuyển${k.ship && shipMethod !== 'express' ? ` <small class="text-muted">(${esc(ghnInfo(k.city, lines))})</small>` : ''}</span><span class="${k.ship === 0 ? 'free' : ''}">${shipText(k.ship)}</span></div><div class="summary-line total"><span>${k.ship === null ? 'Tổng (chưa gồm ship)' : 'Tổng cộng'}</span><b>${fmt(k.total)}</b></div>`;
    /* Phí ô "Giao tiêu chuẩn" theo tỉnh đang chọn */
    const city = form.elements.city.value; let std = shipFee(sub - multi, 'standard', { tinh: city || '?', lines }); if (!city && std) std = null;
    const fe = $('#stdFee'); fe.innerHTML = shipText(std); fe.classList.toggle('text-teal', std === 0);
    $('#coTotal').textContent = fmt(k.total); $('#stickyTotal').textContent = fmt(k.total);
    const bandMa = !loy.combineWithCoupon && k.couponAmt > 0 && !k.dungMa;
    $('#couponHint').innerHTML = bandMa ? `<span class="text-muted">Mã ${esc(k.r.code)} giảm ${fmt(k.couponAmt)} – ít hơn ưu đãi hạng ${esc(k.hang.label)} nên web đang áp dụng mức có lợi hơn cho mẹ.</span>`
      : k.r && k.r.ok ? `<span class="text-teal fw-600">✓ ${k.r.desc}</span>`
      : k.r ? `<span class="text-red">${k.r.msg}</span>`
      : `<span class="text-muted">Có mã giảm giá của shop thì mẹ nhập vào đây nhé.</span>`;
  };

  /* ---- Sản phẩm nên mua kèm (window.MUA_KEM): gợi ý theo danh mục hàng trong giỏ, bỏ hàng đã có / hết hàng ---- */
  const MK = window.MUA_KEM && window.MUA_KEM.enabled ? window.MUA_KEM : null;
  const bienTheCon = (p) => (p.variants ? p.variants.findIndex((v) => !v.oos) : null);
  const goiYMuaKem = () => {
    if (!MK) return [];
    const trongGio = new Set(lines.map((l) => l.id));
    const hopLe = (p) => p && !trongGio.has(p.id) && p.stock > 0 && !p.isCombo && bienTheCon(p) !== -1;
    const chon = new Map();
    /* Lấy xen kẽ theo từng sản phẩm trong giỏ để đơn nhiều loại có gợi ý đa dạng */
    const dsTheoDong = lines.map((l) => (MK.theoDanhMuc || {})[l.p.cat] || []);
    const dai = Math.max(0, ...dsTheoDong.map((d) => d.length));
    for (let i = 0; i < dai; i++) dsTheoDong.forEach((d) => { const [id, lyDo] = d[i] || []; const p = byId(id); if (hopLe(p) && !chon.has(id)) chon.set(id, { p, lyDo }); });
    /* Chưa đủ → bù bằng hàng bán chạy cùng nhóm (cho bé / cho mẹ) */
    const choMe = lines.every((l) => isForMom(l.p)) ? 1 : 0;
    PRODUCTS.filter((p) => hopLe(p) && !chon.has(p.id) && isForMom(p) === choMe).sort(rankDefault)
      .forEach((p) => chon.set(p.id, { p, lyDo: p.sold ? `Bán chạy · đã bán ${p.sold.toLocaleString('vi-VN')}` : 'Mẹ hay mua kèm' }));
    return [...chon.values()].slice(0, MK.soLuong || 4);
  };
  const renderUpsell = () => {
    const box = $('#upsell'); if (!box) return;
    const ds = goiYMuaKem();
    box.classList.toggle('hide', !ds.length);
    if (!ds.length) { box.innerHTML = ''; return; }
    const conFree = SITE.freeshipFrom - (sub - multi);
    const hint = qua && qua.goiY ? `🎁 ${esc(qua.goiY)}`
      : conFree > 0 && conFree <= 1000000 ? `🚚 Mua thêm <b>${fmt(conFree)}</b> để được miễn phí vận chuyển`
      : 'Mẹ thường mua cùng các sản phẩm trong đơn – thêm vào đơn chỉ 1 chạm.';
    box.innerHTML = `<h3>🛍️ Sản phẩm nên mua kèm</h3><p class="upsell__hint">${hint}</p><div class="upsell__list">${ds.map(({ p, lyDo }) => {
      const v = p.variants ? p.variants[bienTheCon(p)] : null;
      return `<div class="upsell__it"><a href="product.html?id=${p.id}" target="_blank"><img src="${productThumb(p)}" alt="" loading="lazy"></a><div class="upsell__info"><a class="n" href="product.html?id=${p.id}" target="_blank">${esc(shortName(p))}</a><small>${esc(lyDo)}</small><b>${fmt(v ? v.price : p.price)}${v ? ` <span>/ ${esc(v.label)}</span>` : ''}</b></div><button class="btn btn--outline btn--sm" type="button" data-upsell="${p.id}">+ Thêm</button></div>`;
    }).join('')}</div>`;
  };

  /* Giỏ thay đổi (thêm từ "mua kèm", sửa trong giỏ nhanh…) → tính lại đơn hàng, quà, phí ship, gợi ý */
  let daDat = false;
  const refreshOrder = () => {
    if (daDat) return;
    lines = Cart.lines();
    if (!lines.length) { location.reload(); return; }
    sub = Cart.subtotal(); multi = Cart.multiDiscount();
    qua = giftFor(lines, { coMa: calc().dungMa }); if (qua && qua.vi && !qua.vi.includes(quaVi)) quaVi = qua.vi[0] || '';
    $('#orderCount').textContent = Cart.count();
    $('#orderItems').innerHTML = itemsHTML();
    $('#giftWrap').innerHTML = giftBox(qua, true, quaVi);
    renderSummary(); renderUpsell();
  };
  document.addEventListener('cart:change', refreshOrder);
  document.addEventListener('stock:change', () => { if (!daDat) renderUpsell(); });

  /* ---- Thanh nhận diện khách quen + xác thực OTP ---- */
  let traCuu = { sdt: '', co: false, ten: '' };
  const renderLoyalty = () => {
    const bar = $('#loyaltyBar'); if (!bar || !loy.enabled) return;
    const s = Session.get(); const sdt = phoneNow();
    if (s && phoneKey(s.sdt) === sdt && sdt) {
      const t = tierOf(Session.spent()); const kh = Session.kh() || {};
      bar.innerHTML = `<div class="loybar loybar--on"><div class="loybar__l">${tierBadge(t)}<div><b>Chào ${esc(kh.ten || 'mẹ')} 👋</b><p>Đã chi tiêu ${fmt(Number(kh.tongChiTieu) || 0)} · ${t.discount ? `đơn này được giảm <b>${t.discount}%</b> theo hạng` : 'mua thêm để lên hạng Silver (giảm 5%)'}</p></div></div><div class="loybar__r"><a class="btn btn--ghost btn--sm" href="account.html">Xem hồ sơ</a><button class="btn btn--ghost btn--sm" type="button" id="loyOut">Thoát</button></div></div>`;
      return;
    }
    if (traCuu.co && traCuu.sdt === sdt) {
      const th = hangCho(sdt) || tierOf(0);
      bar.innerHTML = `<div class="loybar ${th.discount ? 'loybar--on' : ''}"><div class="loybar__l">${th.discount ? tierBadge(th) : '<span class="loybar__ico">👋</span>'}<div><b>Chào ${esc(traCuu.ten || 'mẹ')}, cảm ơn mẹ đã quay lại</b><p>${th.discount ? `Hạng ${esc(th.label)} – <b>đơn này đã được giảm ${th.discount}%</b>. ` : ''}Đã điền thông tin giao hàng lần trước, mẹ kiểm tra lại giúp shop nhé.</p></div></div><div class="loybar__r"><button class="btn btn--primary btn--sm" type="button" id="loyOtp">Đăng nhập</button></div></div>`;
      return;
    }
    /* Chưa đăng nhập: gợi ý đăng nhập cho khách cũ (mật khẩu mặc định) – khách mới vẫn đặt hàng bình thường */
    bar.innerHTML = s ? '' : `<div class="loybar loybar--hint"><div class="loybar__l"><span class="loybar__ico">💡</span><div><b>Mẹ đã từng mua ở ${esc(SITE.name)}?</b><p>Đăng nhập bằng <b>số điện thoại</b>, mật khẩu mặc định là <b>1</b> – thông tin giao hàng tự điền. Chưa mua lần nào thì mẹ cứ điền bên dưới, không cần tài khoản.</p></div></div><div class="loybar__r"><button class="btn btn--primary btn--sm" type="button" id="loyOtp">Đăng nhập</button></div></div>`;
  };
  const kiemTraSdt = () => {
    if (!loy.enabled) return; const sdt = phoneNow();
    if (!phoneOk(sdt)) { traCuu = { sdt: '', co: false, ten: '' }; renderLoyalty(); return; }
    const s = Session.get(); if (s && phoneKey(s.sdt) === sdt) { renderLoyalty(); return; }
    if (traCuu.sdt === sdt) { renderLoyalty(); return; }
    traHang(sdt).then((v) => {
      if (phoneNow() !== sdt) return; traCuu = { sdt, co: !!(v && v.co), ten: (v && (v.ten || v.tenAn)) || '' };
      if (v && v.co) {   /* khách cũ: tự điền các ô còn trống từ thông tin đã lưu (không cần OTP) */
        if (v.ten && !form.elements.name.value.trim()) form.elements.name.value = v.ten;
        if (v.tinh && !form.elements.city.value && DIA.some((p) => p.t === v.tinh)) { form.elements.city.value = v.tinh; form.elements.ward.innerHTML = xaOptions(v.tinh, v.xa || ''); syncExpress(); }
        if (v.diaChi && !form.elements.address.value.trim()) form.elements.address.value = v.diaChi;
      }
      renderLoyalty(); renderSummary();
    });
  };
  const dienHoSo = () => {
    const kh = Session.kh(); if (!kh) return;
    if (kh.ten) form.elements.name.value = kh.ten;
    if (kh.email && !form.elements.email.value) form.elements.email.value = kh.email;
    if (kh.tinh) { form.elements.city.value = kh.tinh; form.elements.ward.innerHTML = xaOptions(kh.tinh, kh.xa || ''); }
    if (kh.diaChi && !form.elements.address.value.trim()) form.elements.address.value = kh.diaChi;
    syncExpress(); renderLoyalty(); renderSummary();
    toast('Đã điền thông tin đã lưu của mẹ', { type: 'ok' });
  };

  const syncExpress = () => { const cityName = form.elements.city.value; const ok = canExpress(cityName); const opt = $('#expressOpt'); opt.classList.toggle('is-disabled', !ok); opt.querySelector('input').disabled = !ok; opt.querySelector('small').textContent = ok ? 'Nội thành Hà Nội, đặt trước 16h' : (cityName ? `Chưa hỗ trợ tại ${cityName}` : 'Chỉ nội thành Hà Nội, đặt trước 16h'); if (!ok && shipMethod === 'express') { shipMethod = 'standard'; form.elements.ship.value = 'standard'; renderSummary(); } };

  /* Có phiên đã xác thực mà ô thông tin còn trống → điền sẵn từ hồ sơ */
  if (Session.get() && !form.elements.phone.value.trim()) { const kh = Session.kh() || {}; if (kh.sdt) form.elements.phone.value = kh.sdt; if (kh.ten && !form.elements.name.value.trim()) form.elements.name.value = kh.ten; if (kh.tinh && !form.elements.city.value) { form.elements.city.value = kh.tinh; form.elements.ward.innerHTML = xaOptions(kh.tinh, kh.xa || ''); } if (kh.diaChi && !form.elements.address.value.trim()) form.elements.address.value = kh.diaChi; if (kh.email && !form.elements.email.value.trim()) form.elements.email.value = kh.email; }
  renderSummary(); syncExpress(); renderLoyalty(); renderUpsell();
  if (Session.get()) refreshProfile().then(() => { renderLoyalty(); renderSummary(); });
  kiemTraSdt();
  $('#stickySubmit').addEventListener('click', () => form.requestSubmit());
  const io = new IntersectionObserver(([en]) => { const so = $('#stickyOrder'); if (so) so.classList.toggle('hide', en.isIntersecting); }, { threshold: 0 }); io.observe($('#coSubmit'));

  let tPhone = 0;
  form.addEventListener('input', (e) => { if (e.target.name === 'phone') { clearTimeout(tPhone); tPhone = setTimeout(kiemTraSdt, 600); } });
  form.addEventListener('change', (e) => {
    if (e.target.name === 'ship') { shipMethod = e.target.value; renderSummary(); }
    if (e.target.name === 'city') { form.elements.ward.innerHTML = xaOptions(e.target.value, ''); syncExpress(); renderSummary(); }
    if (e.target.name === 'giftVi') { quaVi = e.target.value; $$('.giftbox__vi .chip').forEach((ch) => ch.classList.toggle('is-on', ch.querySelector('input').checked)); const n = $('#giftViNote'); if (n) n.textContent = quaVi; }
  });
  document.addEventListener('click', (e) => {
    if (e.target.id === 'loyOtp') { openLogin({ phone: phoneNow() }).then((s) => { if (s) { if (s.kh && s.kh.sdt) form.elements.phone.value = phoneKey(s.kh.sdt); dienHoSo(); } }); }
    if (e.target.id === 'loyOut') { Session.clear(); renderLoyalty(); renderSummary(); }
  });
  form.addEventListener('click', (e) => {
    if (e.target.id === 'applyCoupon') { coupon = $('#couponInput').value.trim().toUpperCase(); const r = applyCoupon(coupon, sub - multi, lines); store.set('mc_coupon', r.ok ? coupon : ''); if (!r.ok) coupon = ''; toast(r.ok ? 'Đã áp dụng mã ' + r.code : r.msg, { type: r.ok ? 'ok' : 'error' }); renderSummary(); }
    const cb = e.target.closest('[data-coupon]'); if (cb) { coupon = cb.dataset.coupon; $('#couponInput').value = coupon; store.set('mc_coupon', coupon); renderSummary(); }
    if (e.target.id === 'clearInfo') { Customer.clear(); location.reload(); }
    const up = e.target.closest('[data-upsell]');
    if (up) { const p = byId(up.dataset.upsell); if (p) { const vi = bienTheCon(p); Cart.add(p.id, 1, vi != null && vi > -1 ? vi : null); toast(`Đã thêm ${shortName(p)} vào đơn`, { type: 'ok' }); } }
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); const fd = new FormData(form); const v = Object.fromEntries(fd.entries()); const err = $('#coError'); err.classList.add('hide');
    $$('.input', form).forEach((i) => i.classList.remove('is-invalid'));
    const bad = []; if (!v.name.trim()) bad.push('name'); if (!phoneOk(v.phone)) bad.push('phone'); if (!v.city) bad.push('city'); if (!v.ward) bad.push('ward'); if (v.address.trim().length < 5) bad.push('address');
    if (bad.length) { bad.forEach((n) => form.elements[n].classList.add('is-invalid')); err.textContent = 'Mẹ kiểm tra lại các ô được đánh dấu đỏ nhé'; err.classList.remove('hide'); err.setAttribute('role', 'alert'); form.elements[bad[0]].scrollIntoView({ behavior: 'smooth', block: 'center' }); form.elements[bad[0]].focus(); return; }
    const diaChi = { tinh: v.city, xa: v.ward, chiTiet: v.address.trim() };
    const fullAddress = addrFull(diaChi);
    Customer.set({ name: v.name.trim(), phone: phoneKey(v.phone), address: addrStore(diaChi), email: v.email, payment: v.payment });
    const btn = $('#coSubmit'); btn.disabled = true; btn.innerHTML = '<span>Đang xử lý đơn hàng…</span>';
    const k = calc(); const s = Session.get();
    const order = await submitOrder({ type: 'checkout',
      customer: { name: v.name.trim(), phone: phoneKey(v.phone), address: fullAddress, email: v.email, tinh: v.city, xa: v.ward, diaChi: v.address.trim() },
      note: v.note, shipMethod, payment: v.payment,
      coupon: k.dungMa ? k.r.code : '',
      hang: k.dungHang ? k.hang.key : '', hangLabel: k.dungHang ? k.hang.label : '', hangTheo: k.dungHang ? (s && phoneKey(s.sdt) === phoneKey(v.phone) ? 'OTP' : 'SĐT') : '', giamHang: k.dungHang ? k.hangAmt : 0,
      token: s ? s.token : '',
      qua: qua && qua.soQua ? { soQua: qua.soQua, ten: qua.ten, vi: quaVi, chuongTrinh: qua.chuongTrinh, moTa: `${qua.moTa} (${quaVi})` } : null,
      items: lines.map((l) => ({ id: l.id, name: l.name, short: shortName(l.p), variant: l.variantLabel, qty: l.qty, price: l.price })),
      subtotal: sub, discount: multi + k.discount, ship: k.ship, total: k.total });
    io.disconnect(); $('#stickyOrder')?.remove();
    daDat = true; Cart.clear(); store.set('mc_coupon', '');
    if (Session.get()) refreshProfile();
    $('#checkoutPage').innerHTML = `<div class="success-page card">${orderSuccessHTML(order, false)}</div>`;
    MC.moiDoiMk();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
</body>
</html>
