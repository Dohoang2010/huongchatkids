<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ADMIN:SEO (trang quản trị ghi đè khối này) -->
  <title>Thông tin khách hàng – Hương Chất Kids</title>
  <meta name="description" content="Đơn hàng gần đây và thông tin giao hàng đã lưu – Hương Chất Kids.">
  <!-- /ADMIN:SEO -->
  <meta name="theme-color" content="#F0537A">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261007q">
  <link rel="icon" type="image/png" sizes="96x96" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/logo-192.png">
</head>
<body>
<main id="app"><div class="container" id="acc"></div></main>
<script src="js/data.js?v=20261007q"></script>
<script src="js/diachi.js?v=20261007q"></script>
<script src="js/qrcode.min.js"></script>
<script src="js/app.js?v=20261007q"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { $, $$, fmt, I, esc, store, Customer, byId, productCard, Wish, toast, phoneOk, phoneKey, maskPhone,
          Session, tierOf, tierNext, tierBadge, tiers, loyaltyApi, openOtp, refreshProfile, couponsFor, addrParse, addrStore, addrFull, GT } = MC;
  const n0 = (x) => Number(x || 0).toLocaleString('vi-VN');
  const DANG_TAI = '<p class="text-muted fs-14">Đang tải…</p>';
  const LOAI_DIEM = { EARN: 'Thưởng giới thiệu', SPEND: 'Dùng điểm mua hàng', REVERSE: 'Thu hồi điểm thưởng', REFUND: 'Hoàn điểm', ADJUSTMENT: 'Shop điều chỉnh', EXPIRE: 'Điểm hết hạn' };

  /* ---------- ⭐ Ví điểm + 🤝 Giới thiệu bạn bè (tải sau khi vẽ hồ sơ) ---------- */
  let gtDaTai = null;
  const diemHTML = (v) => `<div class="diem-vi">
      <div class="diem-vi__so"><small>Điểm khả dụng</small><b>${n0(v.khaDung)}</b><span>điểm · 1 điểm = ${fmt(v.giaTriDiem)}</span></div>
      <div class="diem-vi__ct"><div><small>Đang giữ cho đơn</small><b>${n0(v.dangGiu)}</b></div><div><small>Tổng đã nhận</small><b>${n0(v.tongNhan)}</b></div><div><small>Tổng đã dùng</small><b>${n0(v.tongDung)}</b></div><div><small>Tiết kiệm nhờ điểm</small><b>${fmt(v.tietKiem)}</b></div></div>
    </div>
    ${!v.dungDuoc && v.khaDung ? '<p class="fs-13 text-muted mt-8">🔐 Mẹ đang đăng nhập bằng mật khẩu mặc định. Để dùng điểm khi thanh toán, mẹ xác thực mã OTP hoặc đặt mật khẩu riêng (nút bên phải).</p>' : ''}
    ${v.khaDung ? `<p class="fs-13 mt-8">💡 Dùng điểm ở bước <a class="text-primary fw-600" href="checkout.html">Thanh toán</a> – trừ thẳng vào tiền hàng.</p>` : ''}
    <h4 class="fs-14 mt-16 mb-8">Lịch sử điểm</h4>
    ${(v.lichSu || []).length ? `<div class="diem-ls">${v.lichSu.map((x) => `<div class="diem-ls__it"><div><b>${esc(LOAI_DIEM[x.loai] || x.loai)}</b><small>${esc(x.ngay)}${x.noiDung ? ' · ' + esc(x.noiDung) : ''}</small></div><div class="diem-ls__so ${x.diem > 0 ? 'is-cong' : 'is-tru'}">${x.diem > 0 ? '+' : ''}${n0(x.diem)}<small>Số dư ${n0(x.soDu)}</small></div></div>`).join('')}</div>`
      : '<p class="text-muted fs-14">Chưa có giao dịch điểm nào. Giới thiệu bạn bè mua hàng để nhận điểm nhé!</p>'}`;
  const TT_GT = { 'Đã liên kết': 'badge--soft', 'Chờ giao': 'badge--hot', 'Đã thưởng': 'badge--teal', 'Đã thu hồi': 'badge--soft' };
  const gtHTML = (g) => {
    const c = g.cauHinh || {};
    return `${c.bat ? '' : '<p class="text-red fs-14 mb-8">Chương trình giới thiệu đang tạm dừng.</p>'}
      <p class="fs-14">Bạn bè nhập mã của mẹ được <b>giảm ${c.giam}%</b> cho đơn hàng đầu tiên. Đơn giao thành công, mẹ nhận <b>${c.thuong}% giá trị đơn</b> thành điểm (1 điểm = ${fmt(c.giaTriDiem || 1)}) để trừ tiền khi mua hàng.</p>
      <div class="gt-ma"><small>Mã giới thiệu của mẹ</small><b>${esc(g.ma)}</b></div>
      <div class="gt-nut"><button class="btn btn--primary btn--sm" type="button" data-gt-copy="ma">📋 Copy mã</button><button class="btn btn--outline btn--sm" type="button" data-gt-copy="link">🔗 Copy link</button><button class="btn btn--teal btn--sm" type="button" data-gt-share>📤 Chia sẻ</button></div>
      <div class="gt-tk"><div><b>${n0(g.soNguoi)}</b><small>Người đã giới thiệu</small></div><div><b>${n0(g.daMua)}</b><small>Đã mua hàng</small></div><div><b>${n0(g.tongDiem)}</b><small>Điểm đã nhận</small></div></div>
      ${(g.ds || []).length ? `<div class="diem-ls mt-12">${g.ds.map((x) => `<div class="diem-ls__it"><div><b>Khách ${esc(x.khach)}</b><small>${esc(x.ngay)}</small></div><div class="diem-ls__so"><span class="badge ${TT_GT[x.trangThai] || 'badge--soft'}">${esc(x.trangThai === 'Đã liên kết' ? 'Chưa mua' : x.trangThai)}</span>${x.diem ? `<small>+${n0(x.diem)} điểm</small>` : ''}</div></div>`).join('')}</div>` : '<p class="text-muted fs-14 mt-12">Chưa có ai dùng mã của mẹ. Bấm Chia sẻ để gửi cho bạn bè qua Zalo, Facebook nhé!</p>'}
      ${g.cuaToi ? `<p class="fs-13 text-muted mt-8">Mẹ được giới thiệu bởi ${esc(g.cuaToi.nguoiGT)}.</p>` : ''}`;
  };
  function taiDiemGT() {
    if (!$('#diemCard')) return;
    Promise.all([GT.vi().catch((e) => ({ ok: false, msg: e.message })), GT.cuaToi().catch((e) => ({ ok: false, msg: e.message }))]).then(([v, g]) => {
      const dc = $('#diemCard'), gc = $('#gtCard'); if (!dc || !gc) return;
      if ((v && v.loi === 'token') || (g && g.loi === 'token')) { Session.clear(); render(); return; }
      dc.innerHTML = v && v.ok ? diemHTML(v) : `<p class="text-muted fs-14">${esc((v && v.msg) || 'Chưa tải được ví điểm, mẹ tải lại trang sau ít phút nhé.')}</p>`;
      gtDaTai = g && g.ok ? g : null;
      gc.innerHTML = gtDaTai ? gtHTML(gtDaTai) : `<p class="text-muted fs-14">${esc((g && g.msg) || 'Chưa tải được thông tin giới thiệu.')}</p>`;
      const h = location.hash.slice(1); if (h === 'diem' || h === 'gioi-thieu') document.getElementById(h)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
  const loy = SITE.loyalty || {};
  const DIA = window.DIA_CHI || [];
  const donLocal = () => store.get('mc_orders', []).filter((o) => o.type !== 'callback');
  const wishHTML = () => { const w = Wish.get().map(byId).filter(Boolean); return `<div class="card card--pad"><h3>💗 Sản phẩm yêu thích</h3>${w.length ? `<div class="grid grid--3">${w.map((p) => productCard(p)).join('')}</div>` : '<p class="text-muted fs-14">Nhấn ♥ trên sản phẩm để lưu lại nhé.</p>'}</div>`; };

  /* ---------- Cột chi tiêu để lên hạng ---------- */
  function thangHang(spent) {
    const list = tiers(); const cur = tierOf(spent); const next = tierNext(spent);
    const moc = next ? next.min : (list[list.length - 1] || {}).min || 1;
    const pct = next ? Math.max(3, Math.min(100, Math.round(spent / moc * 100))) : 100;
    return `<div class="tier-prog">
      <div class="tier-prog__head"><div><span class="text-muted fs-13">Tổng đã chi tiêu</span><b class="tier-prog__sum">${fmt(spent)}</b></div>${tierBadge(cur)}</div>
      <div class="tier-prog__bar"><i style="width:${pct}%;background:${cur.color}"></i></div>
      <p class="fs-13 ${next ? '' : 'text-teal fw-600'}">${next ? `Mua thêm <b>${fmt(Math.max(0, next.min - spent))}</b> để lên hạng ${next.icon} <b>${esc(next.label)}</b> – ${esc(next.desc || '')}` : '🎉 Mẹ đang ở hạng cao nhất của shop, cảm ơn mẹ rất nhiều!'}</p>
      <div class="tier-ladder tier-ladder--2">${list.map((t) => `<div class="tier-ladder__col ${t.key === cur.key ? 'is-on' : ''} ${spent >= t.min ? 'is-done' : ''}"><span class="ico">${t.icon}</span><b>${esc(t.label)}</b><small>${t.min ? 'từ ' + fmt(t.min) : 'khởi đầu'}</small><em>${t.discount ? 'giảm ' + t.discount + '%' : '—'}</em></div>`).join('')}</div>
    </div>`;
  }

  /* ---------- Cột trái: thẻ thành viên + vòng tiến độ lên hạng ----------
     o.spent: tổng chi tiêu (null = chưa biết) · o.ten, o.sdt · o.uocTinh: số đơn trên máy (khi chưa xác thực) */
  function theThanhVien(o) {
    const biet = o.spent != null; const spent = biet ? o.spent : 0;
    const cur = tierOf(spent); const next = tierNext(spent);
    const tu = cur.min || 0; const den = next ? next.min : tu;
    const pct = !biet ? 0 : next ? Math.max(4, Math.min(100, Math.round((spent - tu) / Math.max(1, den - tu) * 100))) : 100;
    const C = 2 * Math.PI * 44; const offset = (C * (1 - pct / 100)).toFixed(1);
    const conThieu = next ? Math.max(0, next.min - spent) : 0;
    const loi = !biet ? `Xác thực số điện thoại để xem mẹ đang ở hạng nào và còn bao nhiêu để lên hạng.`
      : next ? `Mua thêm <b>${fmt(conThieu)}</b> để lên hạng <b>${next.icon} ${esc(next.label)}</b> – giảm <b>${next.discount}%</b> mọi đơn.`
      : `🎉 Mẹ đang ở hạng cao nhất – giảm <b>${cur.discount}%</b> mọi đơn. Cảm ơn mẹ!`;
    return `<div class="memcol">
      <div class="memcard memcard--${biet ? cur.key : 'khoa'}">
        <div class="memcard__top"><span class="memcard__brand">${esc(SITE.name)}</span><span class="memcard__type">THẺ THÀNH VIÊN</span></div>
        <div class="memcard__tier"><span class="memcard__ico">${biet ? cur.icon : '🔒'}</span><div><small>Hạng hiện tại</small><b>${biet ? esc(cur.label) : 'Chưa xác thực'}</b></div></div>
        <div class="memcard__foot"><div><small>Chủ thẻ</small><b>${esc(o.ten || 'Mẹ của bé')}</b></div><div style="text-align:right"><small>${o.sdt ? 'SĐT' : 'Ưu đãi'}</small><b>${o.sdt ? esc(maskPhone(o.sdt)) : biet && cur.discount ? '−' + cur.discount + '%' : '—'}</b></div></div>
        <i class="memcard__chip"></i><i class="memcard__shine"></i>
      </div>
      <div class="memring">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" class="memring__bg"/><circle cx="50" cy="50" r="44" class="memring__fg" style="stroke:${biet ? cur.color : '#CFD6DE'};stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${offset}"/></svg>
        <div class="memring__txt"><b>${biet ? pct + '%' : '?'}</b><small>${next ? 'tới ' + esc(next.label) : biet ? 'tối đa' : 'tiến độ'}</small></div>
      </div>
      <div class="memcol__sum"><span>${o.uocTinh ? `Ước tính từ ${o.uocTinh} đơn trên máy này` : 'Tổng đã chi tiêu'}</span><b>${biet ? fmt(spent) : '•••••••'}</b></div>
      <p class="memcol__next">${loi}</p>
      ${!biet || o.uocTinh ? `<button class="btn btn--primary btn--block btn--sm" type="button" data-otp>👤 Đăng nhập xem hạng chính xác</button>` : ''}
    </div>`;
  }

  /* ---------- Chưa xác thực: mời đăng nhập bằng OTP ---------- */
  function renderKhach() {
    const c = Customer.get();
    $('#acc').innerHTML = `<nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><span>Thông tin khách hàng</span></nav>
      <h1 class="page-title">Thông tin khách hàng</h1>
      ${GT.ref() ? `<div class="qb__saved mb-16">🤝 Mẹ được giới thiệu bởi <b>${esc(maskPhone(GT.ref()))}</b> – đăng ký hoặc đặt hàng để được giảm giá cho đơn hàng đầu tiên (mã đã điền sẵn).</div>` : ''}
      <p class="text-muted fs-14 mb-16">${esc(SITE.name)} không bắt buộc đăng ký – mẹ chỉ cần số điện thoại. Để xem hồ sơ, hạng và lịch sử đơn, mẹ xác thực mã OTP gửi về số của mình.</p>
      <div class="checkout">
        <div class="flex flex-col gap-16">
          <div class="card card--pad tier-intro"><div class="tier-hero">
            ${(() => { const dl = donLocal(); return theThanhVien({ spent: dl.length ? dl.reduce((s, o) => s + (Number(o.total) || 0), 0) : null, ten: c && c.name, sdt: c && c.phone, uocTinh: dl.length }); })()}
            <div>
              <h3>🎖️ Hạng khách hàng & ưu đãi</h3>
              <div class="tier-ladder tier-ladder--2">${tiers().map((t) => `<div class="tier-ladder__col"><span class="ico">${t.icon}</span><b>${esc(t.label)}</b><small>${t.min ? 'từ ' + fmt(t.min) : 'khởi đầu'}</small><em>${t.discount ? 'giảm ' + t.discount + '%' : '—'}</em></div>`).join('')}</div>
              <p class="fs-13 text-muted mt-12">Hạng xét theo tổng tiền mẹ đã mua tại shop. Ưu đãi hạng tự động trừ vào đơn ngay khi mẹ xác thực số điện thoại ở bước thanh toán.</p>
            </div>
          </div></div>
          ${donLocal().length ? `<div class="card card--pad"><h3>📦 Đơn đã đặt trên máy này</h3>${donLocal().map(donLocalHTML).join('')}<p class="fs-13 text-muted mt-12">Đây là các đơn lưu trên trình duyệt này. Xác thực OTP để xem đầy đủ lịch sử đơn của mẹ ở mọi thiết bị.</p></div>` : ''}
          ${wishHTML()}
        </div>
        <div class="checkout__side"><div class="card card--pad">
          <h3>👤 Đăng nhập</h3>
          <p class="fs-14 text-muted">Tài khoản là <b>số điện thoại mẹ đã mua hàng</b>, mật khẩu mặc định là <b>1</b> (nếu mẹ chưa đổi). Đăng nhập để xem hạng, tổng chi tiêu, lịch sử đơn và sửa địa chỉ.</p>
          <button class="btn btn--primary btn--lg btn--block mt-12" type="button" id="btnLogin">Đăng nhập</button>
          <p class="fs-13 text-muted mt-8" style="text-align:center"><a class="text-primary fw-700" href="quen-mat-khau.html">Quên mật khẩu?</a> · Đăng nhập bằng <button type="button" class="text-primary fw-600" id="btnOtp">mã OTP</button></p>
          <div class="divider"></div>
          <div id="dkWrap">
            <h3>✨ Mẹ chưa có tài khoản</h3>
            <p class="fs-14 text-muted">Đăng ký 30 giây – chỉ cần điền thông tin, không cần mã OTP.</p>
            <div class="dangky__perk"><i>🎁</i><span>Khách mới: đơn từ ${fmt(((window.QUA_TANG || {}).donTu || {}).muc || 0)} được tặng ${((window.QUA_TANG || {}).donTu || {}).soQua || 0} ${esc((window.QUA_TANG || {}).ten || '')}</span></div>
            <div class="dangky__perk"><i>🥈</i><span>Mua đủ ${fmt((tiers()[1] || {}).min || 0)} lên hạng ${esc((tiers()[1] || {}).label || '')} – giảm ${(tiers()[1] || {}).discount || 0}% mọi đơn sau đó</span></div>
            <div class="dangky__perk"><i>⚡</i><span>Lần sau đặt hàng chỉ 1 chạm, địa chỉ điền sẵn</span></div>
            <div class="dangky__perk"><i>🤝</i><span>Có mã giới thiệu: giảm giá đơn đầu tiên · Giới thiệu bạn bè: nhận điểm trừ tiền khi mua</span></div>
            <button class="btn btn--teal btn--lg btn--block mt-12" type="button" id="btnDangKy">Đăng ký khách hàng mới</button>
          </div>
          <form id="dkForm" class="hide">
            <h3>✨ Đăng ký khách hàng mới</h3>
            <div class="field mt-8"><label>Họ tên <span>*</span></label><input class="input" name="ten" placeholder="VD: Nguyễn Thu Hà" required></div>
            <div class="field mt-8"><label>Số điện thoại <span>*</span></label><input class="input" name="sdt" type="tel" inputmode="numeric" placeholder="VD: 0912 345 678" value="${esc((c && c.phone) || '')}" required></div>
            <div class="field mt-8"><label>Tỉnh / Thành phố</label><select class="input" name="tinh"><option value="">Chọn tỉnh/thành</option>${DIA.map((x) => `<option>${esc(x.t)}</option>`).join('')}</select></div>
            <div class="field mt-8"><label>Xã / Phường</label><select class="input" name="xa" id="dkXa"><option value="">Chọn tỉnh/thành trước</option></select></div>
            <div class="field mt-8"><label>Địa chỉ cụ thể</label><input class="input" name="diaChi" placeholder="Số nhà, tên đường, thôn/xóm…"></div>
            <div class="field mt-8"><label>Email</label><input class="input" name="email" type="email" placeholder="Không bắt buộc"><small class="field__hint">Có email thì shop gửi xác nhận đơn hàng vào đây.</small></div>
            <div class="field mt-8"><label>Mã giới thiệu</label><input class="input" name="ref" type="tel" inputmode="numeric" placeholder="SĐT người giới thiệu (nếu có)" value="${esc(GT.ref())}"><small class="field__hint">🤝 Có mã giới thiệu của bạn bè: được giảm giá cho đơn hàng đầu tiên.</small></div>
            <div class="form-error hide mt-8" id="dkErr" role="alert"></div>
            <button class="btn btn--primary btn--lg btn--block mt-12" type="submit">Tạo tài khoản</button>
            <button class="btn btn--ghost btn--block mt-8" type="button" id="dkHuy">Quay lại</button>
            <p class="qb__privacy">Thông tin chỉ dùng để giao hàng và tư vấn, không chia sẻ cho bên thứ ba. <a href="policy.html?p=bao-mat" target="_blank">Chính sách bảo mật</a></p>
          </form>
          ${c && c.phone ? `<p class="fs-13 text-muted mt-8" style="text-align:center">Số đã lưu trên máy: <b>${esc(maskPhone(c.phone))}</b></p>` : ''}
          <div class="divider"></div><h3>👩‍⚕️ Hỗ trợ</h3><div class="flex flex-col gap-8"><a class="btn btn--primary btn--block" href="tel:${SITE.hotlineTel}">${I.phoneCall}Gọi ${SITE.hotline}</a><a class="btn btn--zalo btn--block" href="${SITE.zalo}" target="_blank" rel="noopener">Chat Zalo</a><button class="btn btn--ghost btn--block" type="button" data-callback>${I.headset}Chuyên gia dinh dưỡng gọi lại</button></div>
        </div></div>
      </div>`;
  }

  const donLocalHTML = (o) => `<div class="cart-item" style="grid-template-columns:1fr auto"><div><b>${esc(o.code)}</b> <span class="badge badge--hot">Đã tiếp nhận</span><div class="fs-13 text-muted mt-8">${new Date(o.createdAt).toLocaleString('vi-VN')} · ${o.items.length} sản phẩm · ${o.payment === 'bank' ? 'Chuyển khoản' : 'COD'}</div><div class="fs-13 mt-8">${o.items.map((i) => esc(i.name) + ' x' + (i.qty || 1)).join('; ')}</div>${o.qua && o.qua.soQua ? `<div class="fs-13 text-teal mt-8">🎁 ${esc(o.qua.moTa || o.qua.ten)}</div>` : ''}</div><div style="text-align:right"><b class="text-primary" style="font-size:17px">${fmt(o.total)}</b><div class="mt-8 flex gap-8 wrap" style="justify-content:flex-end">${o.payment === 'bank' ? `<button class="btn btn--teal btn--sm" type="button" data-pay-qr="${esc(o.code)}">Mã QR thanh toán</button>` : ''}<button class="btn btn--outline btn--sm" type="button" data-reorder-code="${esc(o.code)}">${I.refresh}Mua lại</button></div></div></div>`;

  const donServerHTML = (o) => {
    const tt = String(o.trangThai || '').trim();
    const cls = /huỷ|huy|hoàn/i.test(tt) ? 'badge--soft' : /giao|hoàn thành|xong/i.test(tt) ? 'badge--teal' : 'badge--hot';
    return `<div class="cart-item" style="grid-template-columns:1fr auto"><div><b>${esc(o.ma || '')}</b> <span class="badge ${cls}">${esc(tt || 'Đã tiếp nhận')}</span>
      <div class="fs-13 text-muted mt-8">${esc(o.ngay || '')} · ${esc(o.thanhToan || '')}</div>
      <div class="fs-13 mt-8">${esc(o.sanPham || '').split('\n').filter(Boolean).join(' · ')}</div>
      ${o.qua ? `<div class="fs-13 text-teal mt-8">🎁 ${esc(o.qua)}</div>` : ''}</div>
      <div style="text-align:right"><b class="text-primary" style="font-size:17px">${fmt(Number(o.tong) || 0)}</b></div></div>`;
  };

  /* ---------- Đã xác thực: hồ sơ đầy đủ ---------- */
  function renderHoSo() {
    const s = Session.get(); if (!s) { renderKhach(); return; }
    const kh = s.kh || {}; const spent = Number(kh.tongChiTieu) || 0; const cur = tierOf(spent);
    const don = s.donHang || []; const ma = couponsFor(kh);
    const dc = { tinh: kh.tinh || '', xa: kh.xa || '', chiTiet: kh.diaChi || '' };
    $('#acc').innerHTML = `<nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><span>Thông tin khách hàng</span></nav>
      <div class="flex justify-between items-center wrap gap-8 mb-16"><h1 class="page-title" style="margin:0">Chào ${esc(kh.ten || 'mẹ')} 👋</h1><button class="btn btn--ghost btn--sm" type="button" id="btnOut">Thoát khỏi máy này</button></div>
      <div class="checkout">
        <div class="flex flex-col gap-16">
          <div class="card card--pad"><div class="tier-hero">${theThanhVien({ spent, ten: kh.ten, sdt: kh.sdt })}<div><h3>🎖️ Hạng khách hàng & ưu đãi</h3>${thangHang(spent)}</div></div></div>
          <div class="grid-diem-gt">
            <div class="card card--pad" id="diem"><h3>⭐ Điểm của tôi</h3><div id="diemCard">${DANG_TAI}</div></div>
            <div class="card card--pad" id="gioi-thieu"><h3>🤝 Giới thiệu bạn bè</h3><div id="gtCard">${DANG_TAI}</div></div>
          </div>
          <div class="card card--pad dt-moi"><div><h3>💼 Trở thành đối tác bán hàng</h3><p class="fs-14 text-muted">Chia sẻ link sản phẩm của shop lên Facebook, TikTok, Zalo – nhận <b>hoa hồng</b> cho mỗi đơn giao thành công, thanh toán ngày 10 hằng tháng.</p></div>
            <a class="btn btn--primary" href="doi-tac.html?dk=1">Đăng ký làm đối tác</a></div>

          <div class="card card--pad"><h3>📦 Lịch sử đơn hàng <span class="text-muted fs-13" style="font-weight:500">(${don.length} đơn · ${fmt(spent)})</span></h3>
            ${don.length ? don.map(donServerHTML).join('') : `<div class="empty"><div class="emoji">🧾</div><p>Chưa có đơn nào được ghi nhận. <a class="text-primary fw-600" href="collections.html">Mua sắm ngay</a></p></div>`}
            ${donLocal().length ? `<div class="divider"></div><h4 class="fs-14 text-muted mb-8">Đơn vừa đặt trên máy này</h4>${donLocal().slice(0, 3).map(donLocalHTML).join('')}` : ''}
          </div>

          <div class="card card--pad"><h3>🎟️ Mã giảm giá mẹ đang dùng được</h3>
            ${cur.discount ? `<div class="voucher voucher--tier"><div class="voucher__l">${cur.icon}<b>Ưu đãi hạng ${esc(cur.label)}</b></div><div class="voucher__r"><b>−${cur.discount}%</b><small>Tự động áp dụng, không cần nhập mã</small></div></div>` : ''}
            ${ma.length ? ma.map((c2) => `<div class="voucher"><div class="voucher__l">🎟️<b>${esc(c2.ma)}</b></div><div class="voucher__r"><b>${esc(c2.desc)}</b><small>${c2.min ? 'Đơn từ ' + fmt(c2.min) : 'Mọi đơn hàng'}${c2.donDau ? ' · chỉ cho đơn đầu tiên' : ''}</small></div><button class="btn btn--outline btn--sm" type="button" data-copy-coupon="${esc(c2.ma)}">Chép mã</button></div>`).join('') : '<p class="text-muted fs-14">Hiện chưa có mã nào phù hợp.</p>'}
            ${!loy.combineWithCoupon && cur.discount ? '<p class="fs-13 text-muted mt-8">Ưu đãi hạng và mã giảm giá không cộng dồn – web tự chọn mức có lợi nhất cho mẹ.</p>' : ''}
          </div>
          ${wishHTML()}
        </div>

        <div class="checkout__side"><div class="card card--pad">
          <h3>📍 Thông tin của mẹ</h3>
          <div id="khView" class="kh-view">
            <div class="kh-row"><span>Họ tên</span><b>${esc(kh.ten || '—')}</b></div>
            <div class="kh-row"><span>Số điện thoại</span><b>${esc(kh.sdt || '')}</b></div>
            <div class="kh-row"><span>Địa chỉ</span><b>${esc(addrFull(dc) || '—')}</b></div>
            <div class="kh-row"><span>Email</span><b>${esc(kh.email || '—')}</b></div>
            <div class="kh-row"><span>Hạng</span><b>${tierBadge(cur)}</b></div>
            <div class="kh-row"><span>Tổng chi tiêu</span><b class="text-primary">${fmt(spent)}</b></div>
            <div class="kh-row"><span>Số đơn đã mua</span><b>${Number(kh.soDon) || don.length || 0}</b></div>
            <button class="btn btn--outline btn--block mt-12" type="button" id="btnEdit">✏️ Sửa thông tin / địa chỉ</button>
          </div>
          <div class="divider"></div><h3>🔐 Bảo mật</h3>
          <div class="bm-row"><span>Email</span><b>${kh.email ? `${esc(MC.anEmail(kh.email))} <span class="badge badge--teal">Dùng lấy lại mật khẩu</span>` : '<span class="text-muted">Chưa có</span>'}</b></div>
          <div class="bm-row"><span>Số điện thoại</span><b>${esc(maskPhone(kh.sdt || ''))} <span class="badge badge--teal">✓ Đã xác minh</span></b></div>
          <div class="bm-row"><span>Mật khẩu</span><b>${s.macDinh ? '<span class="text-red">Mật khẩu mặc định</span>' : '••••••••'}</b></div>
          ${!kh.email ? '<p class="fs-13 text-muted mt-8">Thêm email để lấy lại mật khẩu nhanh khi quên (mã OTP gửi về email).</p>' : ''}
          <div class="bm-nut"><button class="btn btn--outline btn--sm" type="button" id="btnDoiMk">🔑 ${s.macDinh ? 'Đặt mật khẩu riêng' : 'Đổi mật khẩu'}</button><a class="btn btn--ghost btn--sm" href="quen-mat-khau.html">Quên mật khẩu</a>${!kh.email ? '<button class="btn btn--ghost btn--sm" type="button" data-them-email>✉️ Thêm email</button>' : ''}</div>
          <form id="khForm" class="hide">
            <div class="field"><label>Họ tên</label><input class="input" name="ten" value="${esc(kh.ten || '')}" required></div>
            <div class="field mt-8"><label>Tỉnh / Thành phố</label><select class="input" name="tinh"><option value="">Chọn tỉnh/thành</option>${DIA.map((x) => `<option ${x.t === dc.tinh ? 'selected' : ''}>${esc(x.t)}</option>`).join('')}</select></div>
            <div class="field mt-8"><label>Xã / Phường</label><select class="input" name="xa" id="khXa"></select></div>
            <div class="field mt-8"><label>Địa chỉ cụ thể</label><input class="input" name="diaChi" value="${esc(dc.chiTiet)}"></div>
            <div class="field mt-8"><label>Email</label><input class="input" name="email" type="email" value="${esc(kh.email || '')}"></div>
            <div class="form-error hide mt-8" id="khErr" role="alert"></div>
            <div class="flex gap-8 mt-12"><button class="btn btn--primary btn--block" type="submit">Lưu lại</button><button class="btn btn--ghost" type="button" id="btnCancel">Huỷ</button></div>
            <p class="fs-13 text-muted mt-8">Thông tin đã được bảo vệ bằng mã OTP gửi về số ${esc(maskPhone(kh.sdt || ''))}.</p>
          </form>
          <div class="divider"></div><h3>👩‍⚕️ Hỗ trợ</h3><div class="flex flex-col gap-8"><a class="btn btn--primary btn--block" href="tel:${SITE.hotlineTel}">${I.phoneCall}Gọi ${SITE.hotline}</a><a class="btn btn--zalo btn--block" href="${SITE.zalo}" target="_blank" rel="noopener">Chat Zalo</a><button class="btn btn--ghost btn--block" type="button" data-callback>${I.headset}Chuyên gia dinh dưỡng gọi lại</button></div>
        </div></div>
      </div>`;
    const xaSel = (tinh, sel) => { const p = DIA.find((x) => x.t === tinh); return p ? `<option value="">Chọn xã/phường</option>${p.x.map((x) => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('')}` : '<option value="">Chọn tỉnh/thành trước</option>'; };
    $('#khXa').innerHTML = xaSel(dc.tinh, dc.xa);
    $('#khForm').addEventListener('change', (e) => { if (e.target.name === 'tinh') $('#khXa').innerHTML = xaSel(e.target.value, ''); });
    $('#khForm').addEventListener('submit', (e) => {
      e.preventDefault(); const f = e.target; const err = $('#khErr'); err.classList.add('hide');
      const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Đang lưu…';
      loyaltyApi('capNhat', { token: s.token, ten: f.ten.value.trim(), tinh: f.tinh.value, xa: f.xa.value, diaChi: f.diaChi.value.trim(), email: f.email.value.trim() })
        .then((res) => {
          if (!res || !res.ok) { err.textContent = (res && res.msg) || 'Chưa lưu được, mẹ thử lại nhé'; err.classList.remove('hide'); btn.disabled = false; btn.textContent = 'Lưu lại'; if (res && res.loi === 'token') { Session.clear(); renderKhach(); } return; }
          Session.patch({ kh: res.kh });
          Customer.set({ ...(Customer.get() || {}), name: res.kh.ten || '', phone: phoneKey(res.kh.sdt), email: res.kh.email || '', address: addrStore({ tinh: res.kh.tinh, xa: res.kh.xa, chiTiet: res.kh.diaChi }) });
          toast('Đã cập nhật thông tin của mẹ', { type: 'ok' }); renderHoSo();
        }).catch((e2) => { err.textContent = e2.message; err.classList.remove('hide'); btn.disabled = false; btn.textContent = 'Lưu lại'; });
    });
  }

  /* Form đăng ký khách mới: nhập thông tin → xác thực OTP → tạo hồ sơ */
  function ganFormDangKy() {
    const f = $('#dkForm'); if (!f) return;
    const xaSel = (tinh) => { const p2 = DIA.find((x) => x.t === tinh); return p2 ? `<option value="">Chọn xã/phường</option>${p2.x.map((x) => `<option>${esc(x)}</option>`).join('')}` : '<option value="">Chọn tỉnh/thành trước</option>'; };
    f.addEventListener('change', (e) => { if (e.target.name === 'tinh') $('#dkXa').innerHTML = xaSel(e.target.value); });
    f.addEventListener('submit', (e) => {
      e.preventDefault(); const err = $('#dkErr'); err.classList.add('hide');
      const ten = f.ten.value.trim(); const sdt = phoneKey(f.sdt.value); const email = f.email.value.trim();
      if (!ten) { err.textContent = 'Mẹ nhập họ tên nhé'; err.classList.remove('hide'); f.ten.focus(); return; }
      if (!phoneOk(sdt)) { err.textContent = 'Số điện thoại chưa đúng (10 số, bắt đầu bằng 0)'; err.classList.remove('hide'); f.sdt.focus(); return; }
      const ref = phoneKey(f.ref.value || '');
      if (ref && !phoneOk(ref)) { err.textContent = 'Mã giới thiệu là số điện thoại 10 số của người giới thiệu'; err.classList.remove('hide'); f.ref.focus(); return; }
      if (ref && ref === sdt) { err.textContent = 'Mẹ không thể dùng mã giới thiệu của chính mình'; err.classList.remove('hide'); f.ref.focus(); return; }
      const hoSo = { sdt, ten, tinh: f.tinh.value, xa: f.xa.value, diaChi: f.diaChi.value.trim(), email, ...(ref ? { ref } : {}) };
      const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Đang tạo tài khoản…';
      const loi = (msg, daCo) => {
        err.innerHTML = esc(msg) + (daCo ? ' <button type="button" class="text-primary fw-700" id="dkDangNhap">Đăng nhập</button> · <button type="button" class="text-primary fw-700" id="dkOtp">Nhận mã OTP</button>' : '');
        err.classList.remove('hide'); btn.disabled = false; btn.textContent = 'Tạo tài khoản';
      };
      loyaltyApi('dangKy', hoSo).then((res) => {
        if (!res || !res.ok) { loi((res && res.msg) || 'Chưa tạo được tài khoản, mẹ thử lại sau ít phút nhé', res && res.daCo); return; }
        if (!res.kh) { loi('Shop đang cập nhật hệ thống, mẹ thử lại sau ít phút hoặc gọi ' + SITE.hotline + ' nhé'); return; }
        const kh = res.kh || {};
        Customer.set({ ...(Customer.get() || {}), name: kh.ten || ten, phone: sdt, email: kh.email || email,
          address: addrStore({ tinh: kh.tinh || hoSo.tinh, xa: kh.xa || hoSo.xa, chiTiet: kh.diaChi || hoSo.diaChi }) });
        store.set('mc_hang_sdt', null);   // xoá bộ nhớ tạm để lần sau tra lại hạng cho đúng
        if (res.gioiThieu && res.gioiThieu.ok) store.set(GT.refKey, { ma: ref, luc: Date.now() });   // thanh toán tự áp mã
        toast('Đã tạo tài khoản cho mẹ 🎉', { type: 'ok' });
        f.outerHTML = `<div class="card card--pad" style="background:var(--teal-50,#F1FAF8);border:1px solid var(--teal-200,#B9E3DC)">
          <h3>🎉 Đã tạo tài khoản cho mẹ</h3>
          <p class="fs-14">Từ giờ mẹ đặt hàng chỉ cần 1 chạm, địa chỉ tự điền sẵn. Ưu đãi theo hạng sẽ tự trừ vào đơn khi mẹ nhập số điện thoại này.</p>
          ${res.gioiThieu ? (res.gioiThieu.ok ? `<p class="fs-14 mt-8 text-teal fw-600">🤝 Đã liên kết mã giới thiệu ${esc(maskPhone(ref))} – đơn hàng đầu tiên của mẹ được giảm ${res.gioiThieu.discountPercent || ''}%, web tự áp khi thanh toán.</p>` : `<p class="fs-14 mt-8 text-red">Mã giới thiệu chưa dùng được: ${esc(res.gioiThieu.message || res.gioiThieu.msg || '')}</p>`) : ''}
          <p class="fs-14 mt-8">Muốn xem hồ sơ, lịch sử đơn và tổng chi tiêu thì mẹ đăng nhập bằng số <b>${esc(sdt)}</b>, mật khẩu mặc định là <b>${esc(res.mkMacDinh || '1')}</b>.</p>
          <div class="flex gap-8 mt-12"><button class="btn btn--primary btn--block" type="button" id="dkVaoLogin">Đăng nhập ngay</button><a class="btn btn--ghost" href="collections.html">Mua sắm</a></div></div>`;
      }).catch((e2) => loi(e2.message));
    });
  }
  const render = () => { if (Session.get()) { renderHoSo(); taiDiemGT(); } else renderKhach(); ganFormDangKy(); };
  render();
  /* Vào từ link giới thiệu (account.html?ref=SĐT) mà chưa đăng nhập → mở sẵn form đăng ký, mã đã điền */
  if (!Session.get() && GT.ref() && MC.param('ref')) setTimeout(() => $('#btnDangKy')?.click(), 50);
  /* Vừa đặt lại mật khẩu (account.html?dangnhap=1) → mở sẵn cửa sổ đăng nhập */
  if (!Session.get() && MC.param('dangnhap')) setTimeout(() => $('#btnLogin')?.click(), 50);
  if (Session.get()) refreshProfile().then(() => render());

  $('#acc').addEventListener('click', (e) => {
    const r = e.target.closest('[data-reorder-code]');
    if (r) { const o = donLocal().find((x) => x.code === r.dataset.reorderCode); if (o) { o.items.forEach((it) => { const p = byId(it.id); if (p) MC.Cart.add(it.id, it.qty || 1, it.variant && p.variants ? Math.max(0, p.variants.findIndex((v) => v.label === it.variant)) : null); }); location.href = 'checkout.html'; } }
    const gc = e.target.closest('[data-gt-copy]');
    if (gc && gtDaTai) { const t = gc.dataset.gtCopy === 'link' ? GT.link(gtDaTai.ma) : gtDaTai.ma; navigator.clipboard?.writeText(t).then(() => toast(gc.dataset.gtCopy === 'link' ? 'Đã chép link giới thiệu' : 'Đã chép mã ' + t, { type: 'ok' }), () => toast(t)); }
    if (e.target.closest('[data-gt-share]') && gtDaTai) {
      const text = GT.noiDung(gtDaTai.cauHinh, gtDaTai.ma); const url = GT.link(gtDaTai.ma);
      if (navigator.share) navigator.share({ title: SITE.name, text: text.replace(url, '').trim(), url }).catch(() => {});
      else navigator.clipboard?.writeText(text).then(() => toast('Đã chép nội dung giới thiệu – mẹ dán vào Zalo / Facebook để gửi bạn bè nhé', { type: 'ok' }), () => toast(text));
    }
    const cp = e.target.closest('[data-copy-coupon]');
    if (cp) { const ma = cp.dataset.copyCoupon; navigator.clipboard?.writeText(ma); store.set('mc_coupon', ma); toast('Đã chép mã ' + ma + ' – mã sẽ tự điền ở bước thanh toán', { type: 'ok' }); }
    if (e.target.id === 'btnLogin' || e.target.closest('[data-otp]')) MC.openLogin({ title: 'Đăng nhập xem hồ sơ' }).then((s) => { if (s) render(); });
    if (e.target.id === 'btnOtp') openOtp({ title: 'Xem hồ sơ khách hàng' }).then((s) => { if (s) render(); });
    if (e.target.id === 'btnDangKy') { $('#dkWrap').classList.add('hide'); $('#dkForm').classList.remove('hide'); $('#dkForm').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#dkForm').ten.focus(); }
    if (e.target.id === 'dkHuy') { $('#dkForm').classList.add('hide'); $('#dkWrap').classList.remove('hide'); }
    if (e.target.id === 'dkDangNhap' || e.target.id === 'dkVaoLogin') $('#btnLogin')?.click();
    if (e.target.id === 'dkOtp') openOtp({ title: 'Xác thực số điện thoại' }).then((ss) => { if (ss) render(); });
    if (e.target.id === 'btnDoiMk') MC.openDoiMk(false).then((ok) => { if (ok) render(); });
    if (e.target.id === 'btnOut') { Session.clear(); toast('Đã thoát khỏi máy này'); render(); }
    if (e.target.closest('[data-them-email]')) { $('#khView').classList.add('hide'); $('#khForm').classList.remove('hide'); $('#khForm').email.focus(); }
    if (e.target.id === 'btnEdit') { $('#khView').classList.add('hide'); $('#khForm').classList.remove('hide'); }
    if (e.target.id === 'btnCancel') { $('#khForm').classList.add('hide'); $('#khView').classList.remove('hide'); }
  });
});
</script>
</body>
</html>
