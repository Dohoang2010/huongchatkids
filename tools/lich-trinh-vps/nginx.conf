# /etc/nginx/sites-available/quanlylichtrinh.site  (certbot sẽ tự thêm phần HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name quanlylichtrinh.site www.quanlylichtrinh.site;

    root /opt/lichtrinh/public;
    index index.html;
    client_max_body_size 256k;

    # Kênh tin tức thì (Server-Sent Events): không đệm, giữ kết nối lâu
    location = /api/luong {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Gửi ảnh / video / tệp trong chat: cho phép tệp lớn, chuyển thẳng tới máy chủ không đệm
    location = /api/tai-len {
        client_max_body_size 160m;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api {
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
