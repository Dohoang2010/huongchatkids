# HTTPS tên miền chính – tự bật khi đã có chứng chỉ /etc/letsencrypt/live/huongchatkids.vn (ngày đổi)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name huongchatkids.vn www.huongchatkids.vn;
  ssl_certificate /etc/letsencrypt/live/huongchatkids.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/huongchatkids.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  root /var/www/huongchatkids;
  index index.html;
  charset utf-8;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain; gzip_min_length 1024;
  include /etc/nginx/hck/api.inc;
  location ~ /\.(git|claude) { deny all; return 404; }
  location ^~ /tools/ { deny all; return 404; }
  location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff2?|mp4)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location = /js/data.js { add_header Cache-Control "private, no-cache, max-age=0" always; try_files $uri =404; }   # dữ liệu web do trang quản trị tự lưu – trình duyệt luôn hỏi lại bản mới
  location ^~ /data/ { add_header Cache-Control "private, no-cache, max-age=0" always; try_files $uri =404; }
  location ~* \.(css|js|json)$ { expires 4h; try_files $uri =404; }
  # Link sản phẩm có từ khoá (/nuoc-ep-lotte-tang-cao), link cũ product.html?id= (301) và sitemap do máy chủ Node tạo (src/trang-web.js)
  location = /product.html { limit_req zone=hck_api burst=60 nodelay; proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /sitemap.xml { proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ $uri.html @trangsp; }
  location @trangsp { limit_req zone=hck_api burst=60 nodelay; proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_intercept_errors off; }
}
