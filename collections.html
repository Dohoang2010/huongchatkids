<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ADMIN:SEO (trang quản trị ghi đè khối này) -->
  <title>Sản phẩm – Hương Chất Kids</title>
  <meta name="description" content="Tất cả sản phẩm dinh dưỡng Hàn Quốc cho bé tại Hương Chất Kids: nước ép Lotte, hồng sâm ChuChu, D3K2, váng sữa canxi, gạc hươu Sumo, rong biển. Lọc theo độ tuổi và nhu cầu của bé.">
  <!-- /ADMIN:SEO -->
  <meta name="theme-color" content="#F0537A">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=optional" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=optional"></noscript>
  <link rel="stylesheet" href="css/style.css?v=20261029b">
  <link rel="icon" type="image/png" sizes="96x96" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/logo-192.png">
</head>
<body>
<div class="dau-cho" aria-hidden="true"></div>
<main id="app"><div class="container">
  <nav class="breadcrumb" id="crumb"></nav>
  <header class="dm-hero" id="dmHero"><div class="dm-hero__chu">
  <h1 class="page-title" id="title">Tất cả sản phẩm</h1>
  <p class="text-muted fs-14 mb-16" id="subtitle"></p>
  <div class="dm-hero__gt" id="dmIntro"></div></div><div class="dm-hero__anh" id="dmAnh" aria-hidden="true"></div></header>
  <div class="dm-con" id="dmCon"></div>
  <section class="km-ds" id="kmDs" hidden></section>
  <div class="chips chips--scroll mb-16" id="ageChips"></div>

  <div class="collection">
    <aside class="filters" id="filters">
      <div class="filters__head"><h3>Bộ lọc</h3><button class="modal__close" type="button" id="closeFilters" aria-label="Đóng"></button></div>
      <div class="fgroup" data-g="age"><h4>Độ tuổi <button type="button" data-clear="age">Bỏ chọn</button></h4><div id="fAge"></div></div>
      <div class="fgroup" data-g="cat"><h4>Danh mục <button type="button" data-clear="cat">Bỏ chọn</button></h4><div id="fCat"></div></div>
      <div class="fgroup" data-g="need"><h4>Nhu cầu của bé <button type="button" data-clear="need">Bỏ chọn</button></h4><div class="fgroup--scroll" id="fNeed"></div></div>
      <div class="fgroup" data-g="size" hidden><h4>Size <button type="button" data-clear="size">Bỏ chọn</button></h4><div class="fgroup--chips" id="fSize"></div></div>
      <div class="fgroup" data-g="mau" hidden><h4>Màu sắc <button type="button" data-clear="mau">Bỏ chọn</button></h4><div class="fgroup--chips" id="fMau"></div></div>
      <div class="fgroup" data-g="brand"><h4>Thương hiệu <button type="button" data-clear="brand">Bỏ chọn</button></h4><div class="fgroup--scroll" id="fBrand"></div></div>
      <div class="fgroup" data-g="price"><h4>Khoảng giá <button type="button" data-clear="price">Bỏ chọn</button></h4><div id="fPrice"></div></div>
      <div class="filters__foot"><button class="btn btn--ghost" type="button" id="resetAll">Xoá tất cả</button><button class="btn btn--primary" type="button" id="applyFilters">Xem kết quả</button></div>
    </aside>

    <div>
      <div class="toolbar">
        <span class="count" id="count"></span>
        <div class="flex gap-8 items-center">
          <button class="btn btn--ghost btn--sm filter-btn" type="button" id="openFilters"><span data-icon="filter"></span>Lọc</button>
          <select class="input" id="sort" aria-label="Sắp xếp">
            <option value="best">Bán chạy nhất</option>
            <option value="price-asc">Giá tăng dần</option>
            <option value="price-desc">Giá giảm dần</option>
            <option value="rating">Đánh giá cao</option>
            <option value="new">Mới nhất</option>
          </select>
        </div>
      </div>
      <div class="active-filters" id="activeFilters"></div>
      <div id="callout"></div>
      <div class="grid grid--4" id="grid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div></main>

<script src="js/data.js?v=20261029h" defer></script>
<script src="js/le-hoi.js?v=20261019c" defer></script>
<script src="js/qrcode.min.js" defer></script>
<script src="js/app.js?v=20261029a" defer></script>
<script src="js/chat.js?v=20261029a" defer></script>
<script type="module">
document.addEventListener('DOMContentLoaded', () => {
  const { $, $$, fmt, I, productCard, brandOf, ageLabel, esc } = MC;
  $$('[data-icon]').forEach((el) => { el.innerHTML = I[el.dataset.icon]; });
  $('#closeFilters').innerHTML = I.close;
  const PER = 12;
  const PRICE_RANGES = [{ key: 'u500', label: 'Dưới 500K', min: 0, max: 500000 }, { key: '500-1000', label: '500K – 1 triệu', min: 500000, max: 1000000 }, { key: '1000-2000', label: '1 – 2 triệu', min: 1000000, max: 2000000 }, { key: 'o2000', label: 'Trên 2 triệu', min: 2000000, max: Infinity }];

  /* State from URL */
  const url = new URLSearchParams(location.search);
  const S = { age: url.getAll('age'), cat: url.getAll('cat'), need: url.getAll('need'), brand: url.getAll('brand'), price: url.getAll('price'), q: url.get('q') || '', tag: url.get('tag') || '', sort: url.get('sort') || 'best', page: Number(url.get('page')) || 1, km: url.get('km') === '1' };
  // hỗ trợ dạng ?cat=a,b và chỉ giữ giá trị hợp lệ (tránh lỗi/XSS từ URL)
  const VALID = { age: AGES.map((a) => a.key), cat: CATEGORIES.map((c) => c.key), need: NEEDS.map((n) => n.key), brand: BRANDS.map((b) => b.key), price: PRICE_RANGES.map((r) => r.key) };
  ['age', 'cat', 'need', 'brand', 'price'].forEach((k) => { S[k] = S[k].flatMap((v) => v.split(',')).filter((v) => VALID[k].includes(v)); });
  S.q = S.q.slice(0, 60); S.tag = ['Combo', 'Mới', 'Bán chạy', 'Hot', 'Sản phẩm hot', 'Cho mẹ', 'Giảm sâu'].includes(S.tag) ? S.tag : ''; if (!['best', 'price-asc', 'price-desc', 'rating', 'new'].includes(S.sort)) S.sort = 'best';

  /* Trang đích theo mục menu (window.TRANG_DM): huongchatkids.vn/<slug> trên web thật, collections.html?dm=<key> khi chạy thử */
  const LOCAL = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const DM_DS = (window.TRANG_DM || []).filter((t) => t.trang !== 'blog');
  const duong = decodeURIComponent(location.pathname.split('/').pop() || '').replace(/\.html$/, '');
  const coLoc = ['age', 'cat', 'need', 'brand', 'price'].some((k) => S[k].length) || S.q || S.tag || S.km;
  let DM = DM_DS.find((t) => t.slug === duong) || DM_DS.find((t) => t.key === url.get('dm')) || (!coLoc ? DM_DS.find((t) => t.key === 'san-pham') : null) || null;
  const datGoc = () => { const l = (DM && DM.loc) || {}; ['age', 'need', 'brand', 'price', 'size', 'mau'].forEach((k) => { S[k] = []; }); S.cat = (l.cat || []).slice(); S.tag = l.tag || ''; S.km = !!l.km; S.q = ''; };
  /* size / màu lấy từ phân loại sản phẩm ("Màu · 36" hoặc "Size 36") – chỉ dùng ở trang Thời trang */
  const thuocTinh = (p) => { const size = new Set(), mau = new Set(); (p.variants || []).forEach((v) => { const l = String(v.label || ''), m = l.split(' · ');
    if (m.length === 2 && /^\d{2,3}$/.test(m[1].trim())) { mau.add(m[0].trim()); size.add(m[1].trim()); } else if (/^Size\s/i.test(l)) size.add(l.replace(/^Size\s*/i, '').trim()); }); return { size: [...size], mau: [...mau] }; };
  const laPhamViDM = () => !!(DM && DM.loc && DM.loc.them && String([...S.cat].sort()) === String([...(DM.loc.cat || [])].sort()));   // loc.them: sản phẩm khác danh mục vẫn hiện trong mục
  const phamVi = () => (DM && DM.loc && DM.loc.cat ? PRODUCTS.filter((p) => DM.loc.cat.includes(p.cat) || (DM.loc.them || []).includes(p.id)) : PRODUCTS);
  const giaTri = (k) => [...new Set(phamVi().flatMap((p) => thuocTinh(p)[k]))].sort((a, b) => (Number(a) || 0) - (Number(b) || 0) || a.localeCompare(b, 'vi'));
  S.size = url.getAll('size').filter((v) => giaTri('size').includes(v)); S.mau = url.getAll('mau').filter((v) => giaTri('mau').includes(v));
  const CT = url.get('ct') && MC.ctDangChay().find((x) => x.c.id === url.get('ct'));
  S.ct = CT ? CT.c.id : '';
  if (DM && !url.getAll('cat').length && !url.get('tag') && !url.get('km')) { const l = DM.loc || {}; S.cat = (l.cat || []).slice(); S.tag = l.tag || ''; S.km = !!l.km; }   // ?dm= kèm lọc khác (size, giá…): giữ phạm vi của mục
  const an = (g) => !!(DM && (DM.an || []).includes(g));
  const laGoc = () => { if (!DM) return false; const l = DM.loc || {}; return !S.q && ['age', 'need', 'brand', 'price', 'size', 'mau'].every((k) => !S[k].length)
    && !S.ct && String([...S.cat].sort()) === String([...(l.cat || [])].sort()) && S.tag === (l.tag || '') && S.km === !!l.km; };

  function syncUrl() {
    const u = new URLSearchParams();
    if (laGoc()) {
      if (S.sort !== 'best') u.set('sort', S.sort); if (S.page > 1) u.set('page', S.page);
      if (LOCAL) { const q = new URLSearchParams({ dm: DM.key }); u.forEach((v, k) => q.set(k, v)); history.replaceState(null, '', 'collections.html?' + q); }
      else history.replaceState(null, '', '/' + DM.slug + (u.toString() ? '?' + u : ''));
      return;
    }
    ['age', 'cat', 'need', 'brand', 'price', 'size', 'mau'].forEach((k) => S[k].forEach((v) => u.append(k, v)));
    if (S.ct) u.set('ct', S.ct);
    if (DM) u.set('dm', DM.key);
    if (S.km) u.set('km', '1'); if (S.q) u.set('q', S.q); if (S.tag) u.set('tag', S.tag); if (S.sort !== 'best') u.set('sort', S.sort); if (S.page > 1) u.set('page', S.page);
    history.replaceState(null, '', 'collections.html' + (u.toString() ? '?' + u : ''));
  }

  let ganDung = false;   // không có sản phẩm khớp đủ từ khoá → đang hiện kết quả gần đúng
  function filtered() {
    const q = S.q.trim().toLowerCase();
    let list = PRODUCTS.filter((p) => {
      if (S.age.length && !S.age.some((a) => p.ages.includes(a))) return false;
      if (S.cat.length && !S.cat.includes(p.cat) && !(laPhamViDM() && DM.loc.them.includes(p.id))) return false;
      if (S.need.length && !S.need.some((n) => p.needs.includes(n))) return false;
      if (S.brand.length && !S.brand.includes(p.brand)) return false;
      if (S.price.length && !S.price.some((k) => { const r = PRICE_RANGES.find((x) => x.key === k); return p.price >= r.min && p.price < r.max; })) return false;
      if (S.tag && !(p.tags || []).includes(S.tag)) return false;
      if (S.ct && !(CT && CT.chinh.has(p.id))) return false;
      if (S.size.length && !S.size.some((z) => thuocTinh(p).size.includes(z))) return false;
      if (S.mau.length && !S.mau.some((z) => thuocTinh(p).mau.includes(z))) return false;
      if (S.km && !MC.dangKhuyenMai(p)) return false;
      return true;
    });
    const sorters = { best: MC.rankDefault, 'price-asc': (a, b) => a.price - b.price, 'price-desc': (a, b) => b.price - a.price, rating: (a, b) => b.rating - a.rating || b.reviews - a.reviews, new: (a, b) => PRODUCTS.indexOf(b) - PRODUCTS.indexOf(a) };
    if (q) { const kq = MC.timSP(q, list); ganDung = kq.ganDung; return S.sort === 'best' ? kq.ds : kq.ds.sort(sorters[S.sort]); }   // có từ khoá: xếp theo độ khớp
    ganDung = false;
    return list.sort(sorters[S.sort] || sorters.best);
  }

  function titleText() {
    if (laGoc()) return DM.ten;
    if (S.ct && CT) return 'Sản phẩm áp dụng: ' + tenCt(CT);
    if (S.q) return ganDung ? `Gợi ý gần đúng cho "${S.q}"` : `Kết quả cho "${S.q}"`;
    if (S.km) return '🏷️ Sản phẩm đang khuyến mãi';
    if (S.tag) return S.tag === 'Combo' ? 'Combo tiết kiệm' : (S.tag === 'Sản phẩm hot' ? '🔥 Sản phẩm hot của shop' : S.tag);
    if (S.cat.length === 1) return (CATEGORIES.find((c) => c.key === S.cat[0]) || {}).label || 'Sản phẩm';
    if (S.need.length === 1) return (NEEDS.find((n) => n.key === S.need[0]) || {}).label || 'Sản phẩm';
    if (S.brand.length === 1) return 'Thương hiệu ' + brandOf({ brand: S.brand[0] }).label;
    if (S.age.length === 1) return 'Sản phẩm cho bé ' + ageLabel(S.age[0]);
    return 'Tất cả sản phẩm';
  }

  function renderFilters() {
    const cb = (name, key, label, count) => `<label><input type="checkbox" name="${name}" value="${esc(key)}" ${S[name].includes(key) ? 'checked' : ''}>${label}<span class="count">${count}</span></label>`;
    const PV = phamVi(), dsCat = DM && DM.loc && DM.loc.cat ? CATEGORIES.filter((c) => DM.loc.cat.includes(c.key)) : CATEGORIES;
    $('#fAge').innerHTML = AGES.map((a) => cb('age', a.key, `${a.emoji} ${a.label}`, PV.filter((p) => p.ages.includes(a.key)).length)).join('');
    $('#fCat').innerHTML = dsCat.map((c) => cb('cat', c.key, c.label, PRODUCTS.filter((p) => p.cat === c.key).length)).join('');
    $('#fNeed').innerHTML = NEEDS.filter((n) => PV.some((p) => p.needs.includes(n.key))).map((n) => cb('need', n.key, n.label, PV.filter((p) => p.needs.includes(n.key)).length)).join('');
    $('#fBrand').innerHTML = BRANDS.filter((b) => PV.some((p) => p.brand === b.key)).map((b) => cb('brand', b.key, b.label, PV.filter((p) => p.brand === b.key).length)).join('');
    $('#fPrice').innerHTML = PRICE_RANGES.map((r) => cb('price', r.key, r.label, PV.filter((p) => p.price >= r.min && p.price < r.max).length)).join('');
    const coSM = !!(DM && DM.locSizeMau);
    ['size', 'mau'].forEach((k) => { const ds = coSM ? giaTri(k) : []; $('[data-g="' + k + '"]').hidden = !ds.length; $(k === 'size' ? '#fSize' : '#fMau').innerHTML = ds.map((v) => cb(k, v, esc(v), PV.filter((p) => thuocTinh(p)[k].includes(v)).length)).join(''); });
    ['age', 'cat', 'need'].forEach((g) => { $('[data-g="' + g + '"]').hidden = an(g); });
    $('#sort').value = S.sort;
  }

  function renderActive() {
    const chips = [];
    const add = (k, v, label) => chips.push(`<button class="chip chip--sm is-active" type="button" data-rm="${k}" data-val="${esc(v)}">${esc(label)} <span class="chip__x">×</span></button>`);
    S.age.forEach((a) => add('age', a, ageLabel(a))); S.cat.forEach((c) => add('cat', c, (CATEGORIES.find((x) => x.key === c) || {}).label)); S.need.forEach((n) => add('need', n, (NEEDS.find((x) => x.key === n) || {}).label)); S.brand.forEach((b) => add('brand', b, brandOf({ brand: b }).label)); S.price.forEach((p) => add('price', p, PRICE_RANGES.find((x) => x.key === p).label));
    if (S.km) add('km', '1', 'Đang khuyến mãi'); if (S.q) add('q', S.q, `"${esc(S.q)}"`); if (S.tag) add('tag', S.tag, S.tag);
    if (S.ct && CT) add('ct', S.ct, tenCt(CT));
    S.size.forEach((v) => add('size', v, 'Size ' + v)); S.mau.forEach((v) => add('mau', v, v));
    if (laGoc()) chips.length = 0;
    $('#activeFilters').innerHTML = chips.length ? chips.join('') + `<button class="chip chip--sm" type="button" id="clearAllChips">Xoá tất cả</button>` : '';
  }

  const linkGoc = (d) => (LOCAL ? 'collections.html?dm=' + d.key : '/' + d.slug);
  const linkCon = (q) => 'collections.html?' + q + (DM ? '&dm=' + DM.key : '');
  function renderHero() {
    const hero = $('#dmHero'); document.body.classList.toggle('dm', !!DM);
    if (!DM) { hero.classList.remove('dm-hero--on'); $('#dmIntro').innerHTML = ''; $('#dmAnh').innerHTML = ''; $('#dmCon').innerHTML = ''; return; }
    document.body.dataset.dm = DM.key; Object.entries(DM.mau || {}).forEach(([k, v]) => document.body.style.setProperty('--dm-' + k, v));
    hero.classList.add('dm-hero--on');
    const goc = laGoc();
    $('#dmIntro').innerHTML = goc && DM.gioiThieu ? `<p>${esc(DM.gioiThieu)}</p>` : '';
    if (!$('#dmAnh').children.length) {
      const l = DM.loc || {}, ds = PRODUCTS.filter((p) => (!l.cat || l.cat.includes(p.cat) || (l.them || []).includes(p.id)) && (!l.tag || (p.tags || []).includes(l.tag)) && (!l.km || MC.dangKhuyenMai(p)) && !p.isCombo).sort(MC.rankDefault).slice(0, 3);
      $('#dmAnh').innerHTML = ds.map((p, i) => `<img src="${MC.productThumb(p)}" alt="" width="180" height="180" ${i ? 'loading="lazy"' : ''}>`).join('');
    }
    let o = [];
    if (goc && DM.con === 'danhMuc') o = CATEGORIES.filter((c) => (!DM.loc.cat || DM.loc.cat.includes(c.key)) && PRODUCTS.some((p) => p.cat === c.key))
      .map((c) => [linkCon('cat=' + c.key), c.image ? `<img src="${c.image}" alt="" width="44" height="44" loading="lazy">` : `<span class="dm-o__ic">${c.icon}</span>`, c.label, PRODUCTS.filter((p) => p.cat === c.key).length]);
    if (goc && DM.con === 'thuongHieu') { const PV = phamVi(); o = BRANDS.filter((b) => PV.some((p) => p.brand === b.key)).map((b) => { const ds = PV.filter((p) => p.brand === b.key);
      return [linkCon((DM.loc.cat || []).map((c) => 'cat=' + c).join('&') + '&brand=' + b.key), `<img src="${MC.productThumb(ds[0])}" alt="" width="44" height="44" loading="lazy">`, b.label, ds.length]; }).filter((x, i, ds) => x[3] >= 2 && !/brand=khac(&|$)/.test(x[0])).sort((a, b) => b[3] - a[3]).slice(0, 8); }
    $('#dmCon').innerHTML = o.map(([href, hinh, ten, n]) => `<a class="dm-o" href="${href}">${hinh}<span><b>${esc(ten)}</b><small>${n} sản phẩm</small></span></a>`).join('');
  }

  /* Thẻ chương trình đang chạy (trang Khuyến mãi) – lấy thẳng từ cấu hình web: QUA_TANG, GIO_VANG, COUPONS */
  const tenCt = (x) => String(x.c.ten || '').replace(/^(Kid|MP|Food)\s*·\s*/i, '');
  const ngayVN = (s) => { const d = new Date(Date.parse(s)); return isNaN(d) ? '' : d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
  function renderKM() {
    const box = $('#kmDs'), bat = DM && DM.key === 'khuyen-mai' && laGoc();
    box.hidden = !bat; if (!bat) { box.innerHTML = ''; return; }
    const the = (ic, nhan, ten, mo, han, nut, href) => `<article class="km-the"><div class="km-the__dau"><span class="km-the__ic" aria-hidden="true">${ic}</span><span class="km-the__nhan">${esc(nhan)}</span></div>
      <h3>${esc(ten)}</h3>${mo ? `<p>${esc(mo)}</p>` : ''}<div class="km-the__chan"><span>${han}</span>${nut ? `<a class="btn btn--sm km-the__nut" href="${href}">${esc(nut)}</a>` : ''}</div></article>`;
    const o = [];
    (window.GIO_VANG || []).filter((g) => !g.tat && !(g.denNgay && g.denNgay < new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10))).forEach((g) => {
      const chay = MC.gioVangChay(g), hieu = (g.brands || []).map((b) => (BRANDS.find((x) => x.key === b) || {}).label).filter(Boolean).join(', ');
      o.push(the('⏰', chay ? 'Đang diễn ra' : 'Mỗi ngày', g.ten + ' giảm ' + g.giam + '%', 'Từ ' + g.tu + ' đến ' + g.den + ' mỗi ngày' + (hieu ? ', áp dụng sản phẩm ' + hieu : '') + '. Giá tự giảm trong khung giờ.', chay ? '<b class="km-the__on">● Đang giảm giá</b>' : 'Bắt đầu lúc ' + esc(g.tu),
        'Xem sản phẩm', (g.brands || []).length === 1 ? linkCon('brand=' + g.brands[0]) : linkCon('km=1')));
    });
    const qd = (window.QUA_TANG || {}).enabled !== false && (window.QUA_TANG || {}).donTu;
    if (qd && qd.muc) o.push(the('🎁', qd.chiKhachMoi ? 'Khách mới' : 'Quà theo đơn', 'Đơn đầu tiên từ ' + fmt(qd.muc) + ' tặng ' + qd.soQua + ' ' + (QUA_TANG.ten || 'quà'), 'Quà tự thêm vào đơn khi đủ điều kiện. Đơn dùng mã giảm giá hoặc voucher thì không kèm quà.', 'Áp dụng khi đặt trên web', '', ''));
    MC.ctDangChay().forEach((x) => {
      const han = Date.parse(x.c.ketThuc) - Date.now() > 180 * 864e5 ? 'Chương trình dài hạn' : 'Đến hết ' + ngayVN(new Date(Date.parse(x.c.ketThuc) - 60000).toISOString());
      o.push(the(Number(x.c.chiGiam) > 0 || x.c.hoacGiam ? '💰' : '🎁', x.chinh.size + ' sản phẩm áp dụng', tenCt(x), MC.ctMoTa(x), esc(han), 'Xem sản phẩm áp dụng', linkCon('ct=' + encodeURIComponent(x.c.id))));
    });
    const ma = (MC.maCongKhai ? MC.maCongKhai() : []).filter((c) => c.loai !== 'sanpham' || (c.sanPham || []).length);
    box.innerHTML = `<div class="km-ds__dau"><h2>Chương trình đang diễn ra</h2><p>Các chương trình không cộng dồn, web tự chọn mức có lợi nhất cho mẹ.</p></div>
      <div class="km-day"><button class="km-day__nut km-day__nut--trai" type="button" data-km-cuon="-1" aria-label="Xem chương trình trước">‹</button><div class="km-luoi" id="kmLuoi">${o.join('')}</div><button class="km-day__nut km-day__nut--phai" type="button" data-km-cuon="1" aria-label="Xem chương trình tiếp">›</button></div>
      ${ma.length ? `<div class="km-ds__dau"><h2>Mã giảm giá</h2><p>Nhập mã ở giỏ hàng hoặc bấm Lưu trong Ví voucher, web tự áp mã lợi nhất khi thanh toán.</p></div>
      <div class="km-ma">${ma.map((c) => `<div class="km-ma__o"><b>${esc(c.ma)}</b><span>${esc(c.desc || c.ten || '')}</span><small>${c.hetHan ? 'HSD ' + ngayVN(c.hetHan) : 'Không thời hạn'}${c.min ? ' · Đơn từ ' + fmt(c.min) : ''}</small></div>`).join('')}
      <a class="km-ma__vi" href="vi-voucher.html">Mở Ví voucher →</a></div>` : ''}
      <div class="km-ds__dau"><h2>Sản phẩm đang có ưu đãi</h2></div>`;
  }

  /* nút ‹ › trượt dải chương trình */
  $('#kmDs').addEventListener('click', (e) => { const n = e.target.closest('[data-km-cuon]'); if (!n) return; const l = $('#kmLuoi'); l.scrollBy({ left: Number(n.dataset.kmCuon) * Math.max(240, l.clientWidth * 0.8), behavior: 'smooth' }); });

  function render() {
    const list = filtered(); const pages = Math.max(1, Math.ceil(list.length / PER)); S.page = Math.min(S.page, pages);
    const t = titleText(); $('#title').textContent = t; document.title = t + ' – ' + SITE.name;
    $('#subtitle').textContent = S.km ? (window.GIO_VANG || []).filter((g) => !g.tat).map((g) => `⏰ ${g.ten} ${g.tu}–${g.den} mỗi ngày giảm ${g.giam}%${MC.gioVangChay(g) ? ' (đang diễn ra)' : ''}`).concat(['🎁 Mua kèm quà tặng', '💰 Combo tiết kiệm']).join(' · ') : S.age.length === 1 ? `Chuyên gia dinh dưỡng đã chọn lọc sản phẩm phù hợp cho bé ${ageLabel(S.age[0])}` : 'Hàng chính hãng · Freeship từ 3 triệu · Đổi trả trong 24h';
    $('#crumb').innerHTML = DM ? `<a href="index.html">Trang chủ</a><span>›</span>${laGoc() ? `<span>${esc(DM.nhan)}</span>` : `<a href="${linkGoc(DM)}">${esc(DM.nhan)}</a><span>›</span><span>${esc(t)}</span>`}`
      : `<a href="index.html">Trang chủ</a><span>›</span><a href="collections.html">Sản phẩm</a>${t !== 'Tất cả sản phẩm' ? `<span>›</span><span>${esc(t)}</span>` : ''}`;
    renderHero(); renderKM();
    $('#ageChips').hidden = an('age');
    $('#ageChips').innerHTML = `<a class="chip ${!S.age.length ? 'is-active' : ''}" href="#" data-age="">Tất cả tuổi</a>` + AGES.map((a) => `<a class="chip ${S.age.length === 1 && S.age[0] === a.key ? 'is-active' : ''}" href="#" data-age="${a.key}">${a.emoji} ${a.label}</a>`).join('');
    $('#count').textContent = `${list.length} sản phẩm`;
    renderActive();
    const babyAge = S.age.length === 1 && ['0-6m', '6-12m'].includes(S.age[0]);
    $('#callout').innerHTML = babyAge ? `<div class="callout"><span class="emoji">👩‍⚕️</span><div><b>Bé dưới 1 tuổi: mẹ nên hỏi chuyên gia dinh dưỡng trước khi dùng thực phẩm bổ sung</b>Ở tuổi này sữa mẹ/sữa công thức là chính; thường chỉ cần vitamin D3 và một số sản phẩm ghi rõ "từ 6 tháng". Chuyên gia dinh dưỡng ${SITE.name} tư vấn miễn phí.</div><button class="btn btn--teal btn--sm" type="button" data-callback>${I.headset}Gọi lại cho tôi</button></div>` : (list.length && list.length <= 2 ? `<div class="callout"><span class="emoji">💬</span><div><b>Chưa thấy sản phẩm mẹ cần?</b>Nhắn Zalo hoặc để lại số, chuyên gia dinh dưỡng sẽ gợi ý sản phẩm phù hợp với bé.</div><a class="btn btn--zalo btn--sm" href="${SITE.zalo}" target="_blank" rel="noopener">Chat Zalo</a></div>` : '');
    const slice = list.slice((S.page - 1) * PER, S.page * PER);
    // Ở mục "Tất cả sản phẩm": hết phần hàng cho bé thì chèn một vạch ngăn trước phần hàng cho mẹ
    const sepAt = S.sort === 'best' && !S.cat.length && !S.q ? slice.findIndex((p) => MC.isForMom(p)) : -1;
    const sep = `<div class="grid__sep"><b>💖 Beauty &amp; thời trang cho mẹ</b><span>Mỹ phẩm, chăm sóc sức khoẻ và đồ lót cho mẹ</span></div>`;
    $('#grid').innerHTML = slice.length ? slice.map((p, i) => (i === sepAt ? sep : '') + productCard(p)).join('') : `<div class="empty" style="grid-column:1/-1"><div class="emoji">🔍</div><h3>Chưa tìm thấy sản phẩm phù hợp</h3><p>Mẹ thử bỏ bớt bộ lọc, hoặc để chuyên gia dinh dưỡng tư vấn trực tiếp nhé.</p><div class="flex gap-8 mt-16" style="justify-content:center;flex-wrap:wrap"><button class="btn btn--ghost" type="button" id="emptyReset">Xoá bộ lọc</button><button class="btn btn--teal" type="button" data-callback>${I.headset}Chuyên gia dinh dưỡng gọi lại</button></div></div>`;
    $('#pagination').innerHTML = pages > 1 ? `<button type="button" data-page="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''}>‹</button>` + Array.from({ length: pages }, (_, i) => `<button type="button" class="${i + 1 === S.page ? 'is-active' : ''}" data-page="${i + 1}">${i + 1}</button>`).join('') + `<button type="button" data-page="${S.page + 1}" ${S.page === pages ? 'disabled' : ''}>›</button>` : '';
    syncUrl();
  }

  /* Events */
  $('#filters').addEventListener('change', (e) => { const i = e.target; if (i.type !== 'checkbox') return; const arr = S[i.name]; if (i.checked) { if (!arr.includes(i.value)) arr.push(i.value); } else S[i.name] = arr.filter((v) => v !== i.value); S.page = 1; if (window.innerWidth >= 992) render(); else $('#count').textContent = `${filtered().length} sản phẩm`; });
  $('#filters').addEventListener('click', (e) => { const c = e.target.closest('[data-clear]'); if (c) { S[c.dataset.clear] = []; renderFilters(); render(); } });
  $('#resetAll').addEventListener('click', () => { S.ct = ''; if (DM) datGoc(); else { ['age', 'cat', 'need', 'brand', 'price', 'size', 'mau'].forEach((k) => S[k] = []); S.q = ''; S.tag = ''; S.km = false; } S.page = 1; renderFilters(); render(); });
  $('#applyFilters').addEventListener('click', () => { $('#filters').classList.remove('is-open'); document.body.classList.remove('no-scroll'); render(); });
  $('#openFilters').addEventListener('click', () => { $('#filters').classList.add('is-open'); document.body.classList.add('no-scroll'); });
  $('#closeFilters').addEventListener('click', () => { $('#filters').classList.remove('is-open'); document.body.classList.remove('no-scroll'); });
  $('#sort').addEventListener('change', (e) => { S.sort = e.target.value; S.page = 1; render(); });
  $('#ageChips').addEventListener('click', (e) => { const a = e.target.closest('[data-age]'); if (!a) return; e.preventDefault(); S.age = a.dataset.age ? [a.dataset.age] : []; S.page = 1; renderFilters(); render(); });
  $('#activeFilters').addEventListener('click', (e) => { const rm = e.target.closest('[data-rm]'); if (rm) { const k = rm.dataset.rm; if (k === 'q' || k === 'tag' || k === 'ct') S[k] = ''; else if (k === 'km') S.km = false; else S[k] = S[k].filter((v) => v !== rm.dataset.val); S.page = 1; renderFilters(); render(); } if (e.target.id === 'clearAllChips') $('#resetAll').click(); });
  $('#pagination').addEventListener('click', (e) => { const b = e.target.closest('[data-page]'); if (b && !b.disabled) { S.page = Number(b.dataset.page); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
  $('#grid').addEventListener('click', (e) => { if (e.target.id === 'emptyReset') $('#resetAll').click(); });
  const si = $('#searchInput'); if (si && S.q) si.value = S.q;

  renderFilters(); render();
});
</script>
</body>
</html>
