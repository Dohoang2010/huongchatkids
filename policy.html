<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trung tâm hỗ trợ – Hương Chất Kids</title>
  <meta name="description" content="Hướng dẫn mua hàng, phương thức thanh toán, chính sách giao hàng, đổi trả & hoàn tiền, bảo mật, điều khoản sử dụng, cam kết chính hãng và câu hỏi thường gặp tại Hương Chất Kids.">
  <meta name="theme-color" content="#F0537A">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23F0537A'/><text x='50' y='68' font-size='56' text-anchor='middle'>🍼</text></svg>">
</head>
<body>
<main id="app"><div class="container" id="policyPage"></div></main>
<script src="js/data.js"></script>
<script src="js/policies.js"></script>
<script src="js/qrcode.min.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { $, $$, fmt, esc, param, I } = MC;
  const fill = (s) => String(s).replace(/\{hotline\}/g, SITE.hotline).replace(/\{zalo\}/g, SITE.hotline).replace(/\{email\}/g, SITE.email).replace(/\{address\}/g, SITE.address).replace(/\{company\}/g, SITE.company).replace(/\{freeship\}/g, fmt(SITE.freeshipFrom)).replace(/\{shipFee\}/g, fmt(SITE.shipFee)).replace(/\{expressFee\}/g, fmt(SITE.expressFee || 35000)).replace(/\{hours\}/g, SITE.workingHours).replace(/\{bankFull\}/g, (SITE.bank || {}).fullName || '').replace(/\{bankAccount\}/g, (SITE.bank || {}).account || '').replace(/\{bankHolder\}/g, (SITE.bank || {}).holder || 'đang cập nhật');
  const groups = [{ key: 'support', title: 'Hỗ trợ khách hàng', desc: 'Chính sách theo Luật Bảo vệ quyền lợi người tiêu dùng 2023 và quy định về thương mại điện tử' }, { key: 'about', title: 'Về Hương Chất Kids', desc: 'Chúng tôi là ai và cam kết gì với mẹ' }];
  const hrefOf = (p) => p.link || `policy.html?p=${p.key}`;
  const key = param('p') || (location.hash ? location.hash.slice(1) : '');
  const cur = POLICIES.find((p) => p.key === key && !p.link);
  const btn = (p, active) => `<a class="pbtn ${active ? 'is-active' : ''}" href="${hrefOf(p)}"><span class="pbtn__icon">${p.icon}</span><span><b>${esc(p.title)}</b><small>${esc(fill(p.summary))}</small></span>${I.chevronR}</a>`;

  if (!cur) {
    /* Trang tổng: 2 nhóm nút */
    $('#policyPage').innerHTML = `<nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><span>Trung tâm hỗ trợ</span></nav>
      <h1 class="page-title">Trung tâm hỗ trợ</h1><p class="text-muted fs-14 mb-16">Cập nhật ngày 21/09/2026 · Cần hỗ trợ ngay? Gọi/Zalo <a class="fw-700 text-primary" href="tel:${SITE.hotlineTel}">${SITE.hotline}</a> (${SITE.workingHours})</p>
      ${groups.map((g) => `<section class="pgroup"><div class="section-head"><div><h2>${g.title}</h2><p>${g.desc}</p></div></div><div class="pgrid">${POLICIES.filter((p) => p.group === g.key).map((p) => btn(p, false)).join('')}</div></section>`).join('')}
      <div class="callout mt-16"><span class="emoji">👩‍⚕️</span><div><b>Chưa tìm thấy câu trả lời?</b>Nhắn Zalo hoặc để lại số, chuyên viên tư vấn gọi lại trong giờ làm việc.</div><div class="flex gap-8"><a class="btn btn--zalo btn--sm" href="${SITE.zalo}" target="_blank" rel="noopener">Chat Zalo</a><button class="btn btn--teal btn--sm" type="button" data-callback>${I.headset}Gọi lại tôi</button></div></div>`;
    return;
  }
  /* Trang chi tiết: menu bên + nội dung */
  document.title = cur.title + ' – Hương Chất Kids';
  const body = cur.faq ? `<div class="faq">${cur.faq.map(([q, a], i) => `<details ${i === 0 ? 'open' : ''}><summary>${esc(q)}</summary><p>${fill(esc(a))}</p></details>`).join('')}</div>` : fill(cur.html);
  const idx = POLICIES.findIndex((p) => p.key === cur.key); const prev = POLICIES[idx - 1], next = POLICIES[idx + 1];
  $('#policyPage').innerHTML = `<nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><a href="policy.html">Hỗ trợ khách hàng</a><span>›</span><span>${esc(cur.title)}</span></nav>
    <div class="policy">
      <aside class="policy__nav" aria-label="Các mục hỗ trợ">${groups.map((g) => `<h4>${g.title}</h4>${POLICIES.filter((p) => p.group === g.key).map((p) => `<a class="${p.key === cur.key ? 'is-active' : ''}" href="${hrefOf(p)}">${p.icon} ${esc(p.title)}</a>`).join('')}`).join('')}</aside>
      <article class="policy__body"><div class="policy__head"><span class="policy__icon">${cur.icon}</span><div><h1>${esc(cur.title)}</h1><p class="text-muted fs-14">${esc(fill(cur.summary))} · Cập nhật 21/09/2026</p></div></div>${body}
        <div class="policy__foot">${prev ? `<a class="btn btn--ghost" href="${hrefOf(prev)}">${I.chevronL}${esc(prev.title)}</a>` : '<span></span>'}${next ? `<a class="btn btn--ghost" href="${hrefOf(next)}">${esc(next.title)}${I.chevronR}</a>` : ''}</div>
        <div class="callout mt-16"><span class="emoji">💬</span><div><b>Cần giải đáp thêm?</b>Gọi/Zalo ${SITE.hotline} (${SITE.workingHours}) hoặc email ${SITE.email}.</div><div class="flex gap-8"><a class="btn btn--zalo btn--sm" href="${SITE.zalo}" target="_blank" rel="noopener">Chat Zalo</a><button class="btn btn--teal btn--sm" type="button" data-callback>${I.headset}Gọi lại tôi</button></div></div>
      </article>
    </div>`;
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
