<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cẩm nang mẹ – Hương Chất Kids</title>
  <meta name="description" content="Cẩm nang chăm con: chọn dinh dưỡng bổ sung theo tháng tuổi, vitamin D3K2, bé biếng ăn, tăng chiều cao, tiêu hoá – do chuyên gia dinh dưỡng Hương Chất Kids biên soạn.">
  <meta name="theme-color" content="#F0537A">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260926a">
  <link rel="icon" type="image/png" sizes="96x96" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/logo-192.png">
</head>
<body>
<main id="app"><div class="container" id="blogPage"></div></main>
<script src="js/data.js?v=20260926a"></script>
<script src="js/qrcode.min.js"></script>
<script src="js/app.js?v=20260926a"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { $, param, esc, I, productCard } = MC;
  const id = param('id'); const post = POSTS.find((p) => p.id === id);
  const card = (p) => `<a class="post-card" href="blog.html?id=${p.id}"><div class="post-card__thumb" style="background:${p.color}">${p.image ? `<img src="${p.image}" alt="" loading="lazy">` : p.emoji}</div><div class="post-card__body"><div class="post-card__meta"><span class="badge badge--soft">${p.cat}</span><span>${p.date} · ${p.read} đọc</span></div><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p></div></a>`;
  if (post) {
    document.title = post.title + ' – Cẩm nang Hương Chất Kids';
    const rel = { 'Dinh dưỡng': 'cat=nuoc-ep', 'Vitamin': 'need=d3k2', 'Chăm con': 'need=tang-can', 'Tuổi teen': 'age=12-18y', 'Tiêu hoá': 'need=tieu-hoa', 'Mua sắm': 'cat=hong-sam' }[post.cat] || '';
    const sug = PRODUCTS.filter((p) => { const u = new URLSearchParams(rel); return (!u.get('cat') || p.cat === u.get('cat')) && (!u.get('need') || p.needs.includes(u.get('need'))) && (!u.get('age') || p.ages.includes(u.get('age'))); }).sort((a, b) => b.sold - a.sold).slice(0, 4);
    $('#blogPage').innerHTML = `<nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><a href="blog.html">Cẩm nang mẹ</a><span>›</span><span>${esc(post.cat)}</span></nav>
      <article class="post"><div class="post__hero" style="background:${post.color}">${post.image ? `<img src="${post.image}" alt="">` : post.emoji}</div><div class="post-card__meta mb-12"><span class="badge badge--soft">${post.cat}</span><span>${post.date} · ${post.read} đọc · Chuyên gia dinh dưỡng Hương Chất Kids</span></div><h1>${esc(post.title)}</h1><p class="text-muted mb-16" style="font-size:16px">${esc(post.excerpt)}</p><div class="post__body">${post.body.map((t) => `<p>${esc(t)}</p>`).join('')}</div>
      <div class="post__cta"><span class="emoji">👩‍⚕️</span><div><b>Mẹ còn băn khoăn về bé?</b><small>Để lại số điện thoại, chuyên gia dinh dưỡng gọi tư vấn miễn phí trong 5 phút.</small></div><button class="btn btn--teal" type="button" data-callback>${I.headset}Gọi lại cho tôi</button></div></article>
      <section class="section"><div class="section-head"><div><h2>Sản phẩm liên quan</h2></div><a class="link" href="collections.html?${rel}">Xem thêm ${I.arrowR}</a></div><div class="grid grid--4">${sug.map((p) => productCard(p)).join('')}</div></section>
      <section class="section"><div class="section-head"><div><h2>Bài viết khác</h2></div></div><div class="grid grid--3">${POSTS.filter((p) => p.id !== id).slice(0, 3).map(card).join('')}</div></section>`;
  } else {
    const cats = [...new Set(POSTS.map((p) => p.cat))];
    $('#blogPage').innerHTML = `<nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><span>Cẩm nang mẹ</span></nav><h1 class="page-title">Cẩm nang mẹ 📖</h1><p class="text-muted fs-14 mb-16">Kiến thức dinh dưỡng & chăm con được chuyên gia dinh dưỡng Hương Chất Kids biên soạn, chỉ mang tính tham khảo</p>
      <div class="chips chips--scroll mb-16" id="blogChips"><button class="chip is-active" data-cat="">Tất cả</button>${cats.map((c) => `<button class="chip" data-cat="${c}">${c}</button>`).join('')}</div><div class="grid grid--3" id="blogGrid">${POSTS.map(card).join('')}</div>`;
    $('#blogChips').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (!b) return; MC.$$('#blogChips .chip').forEach((x) => x.classList.toggle('is-active', x === b)); $('#blogGrid').innerHTML = POSTS.filter((p) => !b.dataset.cat || p.cat === b.dataset.cat).map(card).join(''); });
  }
});
</script>
</body>
</html>
