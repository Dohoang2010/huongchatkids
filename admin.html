<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị – Hương Chất Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=20261003c">
  <link rel="icon" type="image/png" sizes="96x96" href="img/logo-96.png">
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div class="login" id="login">
  <form class="login__box" id="loginForm">
    <img src="img/logo-96.png" alt="" width="56" height="56">
    <h1>Trang quản trị</h1>
    <p>Hương Chất Kids</p>
    <label>Tên đăng nhập
      <input id="lgId" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="adminhck" required></label>
    <label>Mật khẩu
      <input id="lgPw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
    <div class="err hide" id="lgErr"></div>
    <button class="btn btn--primary btn--lg" type="submit">Đăng nhập</button>
    <small>Trang dành cho chủ shop. Phiên đăng nhập tự hết sau 8 giờ không dùng.</small>
  </form>
</div>

<!-- KHUNG QUẢN TRỊ (core.js dựng) -->
<div class="app hide" id="app"></div>

<div class="modal hide" id="modal"></div>
<div class="toast hide" id="toast"></div>

<script src="js/data.js?v=20261003c"></script>
<script src="js/diachi.js?v=20261003c"></script>
<script src="js/admin/core.js?v=20261003c"></script>
<script src="js/admin/preview.js?v=20261003c"></script>
<script src="js/admin/m-dashboard.js?v=20261003c"></script>
<script src="js/admin/m-products.js?v=20261003c"></script>
<script src="js/admin/m-marketing.js?v=20261003c"></script>
<script src="js/admin/m-website.js?v=20261003c"></script>
<script src="js/admin/m-system.js?v=20261003c"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const A = window.ADMIN;
  const vao = () => { document.getElementById('login').classList.add('hide'); document.getElementById('app').classList.remove('hide'); A.batDau(); };
  if (A.dangNhapHopLe()) vao();
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('lgId').value.replace(/\s/g, '').toLowerCase();
    const mk = document.getElementById('lgPw').value.replace(/\s/g, '');
    const err = document.getElementById('lgErr');
    if (id === A.TAI_KHOAN.id && mk === A.TAI_KHOAN.mk) { A.ghiPhien(); vao(); return; }
    err.innerHTML = !id || !mk ? 'Mẹ nhập đủ tên đăng nhập và mật khẩu nhé'
      : id !== A.TAI_KHOAN.id ? 'Tên đăng nhập chưa đúng. Phải là <b>adminhck</b> (viết liền, không dấu).'
      : 'Mật khẩu chưa đúng.';
    err.classList.remove('hide');
  });
});
</script>
</body>
</html>
