<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị – Hương Chất Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=20261007e">
  <link rel="icon" type="image/png" sizes="96x96" href="img/logo-96.png">
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div class="login" id="login">
  <form class="login__box" id="loginForm">
    <img src="img/logo-96.png" alt="" width="56" height="56">
    <h1>Trang quản trị</h1>
    <p>Hương Chất Kids</p>
    <label>Tên đăng nhập
      <input id="lgId" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="adminhck" required></label>
    <label>Mật khẩu
      <input id="lgPw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
    <div class="err hide" id="lgErr"></div>
    <button class="btn btn--primary btn--lg" type="submit">Đăng nhập</button>
    <small>Trang dành cho chủ shop. Phiên đăng nhập tự hết sau 8 giờ không dùng.</small>
  </form>
</div>

<!-- KHUNG QUẢN TRỊ (core.js dựng) -->
<div class="app hide" id="app"></div>

<div class="modal hide" id="modal"></div>
<div class="toast hide" id="toast"></div>

<script src="js/data.js?v=20261007e"></script>
<script src="js/diachi.js?v=20261007e"></script>
<script src="js/admin/core.js?v=20261007e"></script>
<script src="js/admin/preview.js?v=20261007e"></script>
<script src="js/admin/m-dashboard.js?v=20261007e"></script>
<script src="js/admin/m-products.js?v=20261007e"></script>
<script src="js/admin/m-orders.js?v=20261007e"></script>
<script src="js/admin/m-customers.js?v=20261007e"></script>
<script src="js/admin/m-gioi-thieu.js?v=20261007e"></script>
<script src="js/admin/m-marketing.js?v=20261007e"></script>
<script src="js/admin/m-qua-tang.js?v=20261007e"></script>
<script src="js/admin/m-voucher.js?v=20261007e"></script>
<script src="js/admin/m-menu.js?v=20261007e"></script>
<script src="js/admin/m-content.js?v=20261007e"></script>
<script src="js/admin/m-seo.js?v=20261007e"></script>
<script src="js/admin/m-website.js?v=20261007e"></script>
<script src="js/admin/m-theme.js?v=20261007e"></script>
<script src="js/admin/m-versions.js?v=20261007e"></script>
<script src="js/admin/m-users.js?v=20261007e"></script>
<script src="js/admin/m-system.js?v=20261007e"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const A = window.ADMIN;
  const vao = () => { document.getElementById('login').classList.add('hide'); document.getElementById('app').classList.remove('hide'); A.batDau(); };
  if (A.dangNhapHopLe()) vao();
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('lgId').value.replace(/\s/g, '').toLowerCase();
    const mk = document.getElementById('lgPw').value.replace(/\s/g, '');
    const err = document.getElementById('lgErr'); err.classList.add('hide');
    const nut = e.target.querySelector('button[type=submit]');
    if (!id || !mk) { err.textContent = 'Nhập đủ tên đăng nhập và mật khẩu nhé'; err.classList.remove('hide'); return; }
    /* Nhập sai nhiều lần thì bắt chờ, chống dò mật khẩu */
    const sai = Number(localStorage.getItem('hck_dn_sai') || 0);
    const cho = Number(localStorage.getItem('hck_dn_cho') || 0);
    if (cho > Date.now()) {
      err.textContent = `Nhập sai nhiều lần, thử lại sau ${Math.ceil((cho - Date.now()) / 1000)} giây`;
      err.classList.remove('hide'); return;
    }
    nut.disabled = true; nut.textContent = 'Đang kiểm tra…';
    const batSai = () => {
      const n = sai + 1; localStorage.setItem('hck_dn_sai', String(n));
      if (n >= 4) localStorage.setItem('hck_dn_cho', String(Date.now() + Math.min(300, 2 ** (n - 3) * 15) * 1000));
    };
    /* Tài khoản trên máy chủ (mật khẩu băm trong Google Sheet) */
    let mayChuTraLoi = false;
    try {
      const r = await A.api('qtDangNhap', { tk: id, mk });
      if (r && typeof r.ok === 'boolean') mayChuTraLoi = true;
      if (r && r.ok && r.token) {
        localStorage.removeItem('hck_dn_sai'); localStorage.removeItem('hck_dn_cho');
        sessionStorage.setItem('hck_qt_token', r.token);
        sessionStorage.setItem('hck_qt_nd', JSON.stringify({ ten: r.ten, vaiTro: r.vaiTro, tk: r.tk }));
        A.ghiPhien(); location.reload(); return;
      }
      if (r && r.msg && r.ten === undefined && !/chưa đúng/.test(r.msg)) {
        err.textContent = r.msg; err.classList.remove('hide'); nut.disabled = false; nut.textContent = 'Đăng nhập'; return;
      }
    } catch { mayChuTraLoi = false; }
    /* Tài khoản chủ shop luôn vào được, kể cả khi máy chủ chưa sẵn sàng hoặc mất mạng */
    if (id === A.TAI_KHOAN.id && mk === A.TAI_KHOAN.mk) {
      localStorage.removeItem('hck_dn_sai'); localStorage.removeItem('hck_dn_cho');
      A.ghiPhien(); vao(); return;
    }
    batSai();
    err.innerHTML = mayChuTraLoi ? 'Tên đăng nhập hoặc mật khẩu chưa đúng.'
      : 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.';
    err.classList.remove('hide'); nut.disabled = false; nut.textContent = 'Đăng nhập';
  });
});
</script>
</body>
</html>
